<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>خانه‌یار | سامانهٔ جامع مسکن</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--bg:#f4f7fb;--ink:#101d33;--ink2:#3d4a5f;--muted:#6b7a90;--line:#e3e9f2;--brand:#0e7c6b;--brand2:#12a389;--soft:#e6f5f1;--bline:#bfe5dd;--accent:#e8a13a;--asoft:#fdf3e3;--danger:#d9534f;--dsoft:#fdecec;--ok:#2e9e5b;--osoft:#e9f7ef;--dark:#0d1626;--r:16px;--sh:0 10px 30px -12px rgba(15,27,45,.14)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Vazirmatn',Tahoma,sans-serif;background:var(--bg);color:var(--ink);direction:rtl;line-height:1.9;font-size:15px}
button{font-family:inherit}
.topbar{position:sticky;top:0;z-index:60;background:rgba(13,22,38,.95);backdrop-filter:blur(8px);border-bottom:1px solid rgba(255,255,255,.08)}
.topbar-in{max-width:1440px;margin:auto;display:flex;align-items:center;gap:10px;padding:10px 18px}
.brand{display:flex;align-items:center;gap:10px;color:#fff;font-weight:800;font-size:18px;cursor:pointer;white-space:nowrap}
.brand .mark{width:36px;height:36px;border-radius:11px;background:linear-gradient(135deg,var(--brand2),var(--brand));display:grid;place-items:center;color:#fff}
.brand small{display:block;font-size:10px;font-weight:400;color:#9fb0c8}
#tokchip{display:flex;align-items:center;gap:8px;margin-inline-start:auto;flex-wrap:wrap}
.tok{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:#fff;border-radius:99px;padding:5px 13px;font-size:12.5px;cursor:pointer}
.tok b{font-size:13px}
main{max-width:1440px;margin:auto;padding:22px 18px 80px}
.app{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:18px;align-items:start}
.side{order:2;position:sticky;top:72px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px;max-height:calc(100vh - 92px);overflow:auto}
.sg{font-size:11px;font-weight:700;color:var(--muted);margin:12px 8px 5px}
.sitem{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:10px;font-size:13px;cursor:pointer;color:var(--ink2)}
.sitem:hover{background:#f1f5fa}
.sitem.on{background:var(--soft);color:var(--brand);font-weight:700}
.sitem .bd{margin-inline-start:auto;font-size:10.5px;background:#eef1f6;border-radius:99px;padding:2px 8px;color:var(--muted);white-space:nowrap}
.sitem .bd.ok{background:var(--osoft);color:var(--ok)}
.view{display:none}.view.on{display:block;animation:fadeUp .35s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.grid{display:grid;gap:16px}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:1100px){.g4{grid-template-columns:1fr 1fr}.g3{grid-template-columns:1fr 1fr}}
@media(max-width:700px){.g2,.g3,.g4{grid-template-columns:1fr}}
@media(max-width:980px){.app{display:block}.side{position:static;max-height:none;display:flex;flex-wrap:wrap;gap:5px;margin-bottom:14px}.side .sg{width:100%;margin:4px 2px}.sitem .bd{display:none}}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--sh)}
.card.tight{padding:14px}
.ct{font-size:15px;font-weight:800;margin-bottom:12px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:6px 13px;border-radius:99px;border:1px solid var(--line);background:#fff;font-size:12.5px;color:var(--ink2);cursor:pointer;transition:.15s;user-select:none}
.chip:hover{border-color:var(--bline)}
.chip.on{background:var(--soft);border-color:var(--brand);color:var(--brand);font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;padding:3px 10px;border-radius:8px;font-weight:600}
.b-ok{background:var(--osoft);color:var(--ok)}.b-warn{background:var(--asoft);color:#a06a12}.b-bad{background:var(--dsoft);color:var(--danger)}.b-info{background:#eef3fd;color:#33549e}
.btn{border:1px solid var(--line);background:#fff;color:var(--ink2);border-radius:10px;padding:9px 18px;font-size:13.5px;cursor:pointer;transition:.15s;font-weight:600}
.btn:hover{border-color:var(--brand);color:var(--brand)}
.btn-primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn-primary:hover{background:var(--brand2);color:#fff}
.btn-sm{padding:6px 12px;font-size:12px}.btn-xs{padding:4px 10px;font-size:11.5px}.btn-lg{padding:13px 28px;font-size:15px}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.srow{margin-bottom:13px}
.slab{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--ink2);margin-bottom:3px;gap:8px;flex-wrap:wrap}
.slab b{color:var(--brand)}
.tinp{width:92px;padding:4px 6px;border:1px solid var(--line);border-radius:8px;direction:ltr;text-align:center;font-family:inherit;font-size:12px;background:#fff;color:var(--ink)}
input[type=range]{width:100%;direction:ltr;accent-color:var(--brand);height:22px;cursor:pointer}
.inp{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font-family:inherit;font-size:13px;background:#fff}
.gauge{height:10px;background:#edf1f7;border-radius:99px;overflow:hidden}
.gauge i{display:block;height:100%;border-radius:99px;background:var(--ok);transition:.3s;width:0}
.gauge i.warn{background:var(--accent)}.gauge i.bad{background:var(--danger)}
.pbar{height:8px;background:#edf1f7;border-radius:99px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--brand);border-radius:99px;transition:.3s}
.kv{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:13px;flex-wrap:wrap}
.kv:last-child{border:none}.kv span{color:var(--muted)}.kv b{font-weight:600}
.alert{border-radius:12px;padding:11px 14px;font-size:12.8px;border:1px solid;margin-top:8px}
.al-ok{background:var(--osoft);border-color:#bfe5cd;color:#1c6b40}
.al-warn{background:var(--asoft);border-color:#f2ddb2;color:#7c5410}
.al-bad{background:var(--dsoft);border-color:#f2c8c7;color:#96302d}
.seg{display:inline-flex;background:#eef1f6;border-radius:11px;padding:4px;gap:3px;flex-wrap:wrap}
.seg button{border:none;background:none;padding:6px 14px;border-radius:8px;font-size:12.5px;cursor:pointer;color:var(--ink2);font-weight:600}
.seg button.on{background:#fff;color:var(--brand);box-shadow:0 1px 4px rgba(15,27,45,.12)}
.switch{position:relative;width:44px;height:24px;flex:none;cursor:pointer;display:inline-block}
.switch input{opacity:0;width:0;height:0}
.switch .tr{position:absolute;inset:0;background:#cfd8e4;border-radius:99px;transition:.2s}
.switch .tr::after{content:'';position:absolute;top:3px;right:3px;width:18px;height:18px;background:#fff;border-radius:50%;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.switch input:checked+.tr{background:var(--brand)}
.switch input:checked+.tr::after{transform:translateX(-20px)}
.note{font-size:12px;color:var(--muted);line-height:1.9}
.mini{font-size:13px;font-weight:800;margin:20px 0 10px;color:var(--ink2)}
.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.stat b{font-size:21px;font-weight:800;color:var(--brand);display:block;line-height:1.4}
.stat span{font-size:11.5px;color:var(--muted)}
.steps{display:flex;gap:8px;margin:14px 0 18px;flex-wrap:wrap}
.st{flex:1;min-width:88px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:9px 6px;text-align:center;font-size:11px;color:var(--muted)}
.st b{display:block;font-size:12px;color:var(--ink2)}
.st .stn{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:#eef1f6;color:var(--muted);font-size:11px;font-weight:700;margin-bottom:4px}
.st.cur{border-color:var(--brand);background:var(--soft)}
.st.cur .stn{background:var(--brand);color:#fff}
.st.done{background:var(--osoft);border-color:#bfe5cd;color:#1c5c3a}
.st.done .stn{background:var(--ok);color:#fff}
.st[data-jump]{cursor:pointer}
.wtop{display:flex;align-items:flex-start;gap:12px;margin-bottom:4px;flex-wrap:wrap}
.wtop h2{font-size:20px;font-weight:800}
.wtop p{font-size:12.5px;color:var(--muted)}
.wprog{margin-inline-start:auto;background:var(--soft);color:var(--brand);border-radius:99px;padding:6px 14px;font-size:12px;font-weight:700;white-space:nowrap}
.wnav{display:flex;gap:10px;align-items:center;margin-top:18px;flex-wrap:wrap}
.wnav .note{flex:1;text-align:center;min-width:160px}
.ph{position:relative;overflow:hidden;height:100%;background:linear-gradient(135deg,#3f5e79,#2c4258)}
.ph .fb{position:absolute;inset:0;display:grid;place-items:center;color:rgba(255,255,255,.85);font-size:24px}
.ph img{position:relative;width:100%;height:100%;object-fit:cover;display:block;z-index:1}
.lcard{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;transition:.15s}
.lcard:hover{box-shadow:var(--sh)}
.lcard.sel{border-color:var(--brand);box-shadow:0 0 0 2px var(--soft)}
.lart{position:relative;height:150px;overflow:hidden;background:#2c4258}
.lart .match{position:absolute;top:8px;right:8px;background:rgba(13,22,38,.72);color:#fff;font-size:10.5px;padding:3px 10px;border-radius:99px;z-index:3}
.lbody{padding:12px 14px;display:flex;flex-direction:column;gap:7px;flex:1}
.lbody h4{font-size:13.5px;font-weight:800}
.adr{font-size:11.5px;color:var(--muted)}
.ltags{display:flex;flex-wrap:wrap;gap:4px}
.ltags span{font-size:10.5px;background:#f1f5fa;color:var(--ink2);padding:2px 8px;border-radius:6px}
.lfoot{display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:9px;border-top:1px dashed var(--line);gap:8px;flex-wrap:wrap}
.lfoot .pr b{font-size:15px;color:var(--brand)}
.lfoot .pr span{font-size:10.5px;color:var(--muted);display:block}
.tblwrap{overflow-x:auto;background:#fff;border:1px solid var(--line);border-radius:12px}
.tbl{width:100%;border-collapse:collapse;font-size:12.6px;min-width:520px}
.tbl th{text-align:right;padding:9px 12px;color:var(--muted);font-size:11.5px;border-bottom:1px solid var(--line);background:#f8fafc;font-weight:600}
.tbl td{padding:8px 12px;border-bottom:1px dashed var(--line);text-align:right}
.tbl tr:last-child td{border-bottom:none}
#v-auth{max-width:420px;margin:40px auto}
.pack{border:1px solid var(--line);border-radius:16px;padding:22px;background:#fff;text-align:center;position:relative}
.pack.best{border-color:var(--brand);box-shadow:var(--sh)}
.pack .pk{font-size:15px;font-weight:800}
.pack .pt{font-size:20px;font-weight:800;color:var(--brand);margin:6px 0}
.pack ul{list-style:none;text-align:right;font-size:12.5px;color:var(--ink2)}
.pack ul li{padding:3px 0}
.badge-best{position:absolute;top:-11px;right:50%;transform:translateX(50%);background:var(--brand);color:#fff;font-size:10.5px;padding:3px 12px;border-radius:99px}
.tl{position:relative;padding-right:24px;margin-top:8px}
.tl::before{content:'';position:absolute;right:8px;top:8px;bottom:8px;width:2px;background:var(--line)}
.tli{position:relative;padding:6px 0;font-size:13px}
.tli .dot{position:absolute;right:-24px;top:10px;width:18px;height:18px;border-radius:50%;background:#fff;border:2px solid #c6d2e0;display:grid;place-items:center;font-size:9px;color:transparent}
.tli.done .dot{background:var(--ok);border-color:var(--ok);color:#fff}
.tli.act .dot{border-color:var(--accent);color:var(--accent)}
.tli small{display:block;color:var(--muted);font-size:11.5px}
.chart{width:100%;height:auto}
.chart .cg{stroke:#eef2f8;stroke-width:1}
.chart .cl{fill:#93a0b4;font-size:10.5px;font-family:Vazirmatn}
.chart .xl{fill:#93a0b4;font-size:9.5px;font-family:Vazirmatn}
.chart .cline{fill:none;stroke:var(--brand);stroke-width:2.4;stroke-linecap:round}
.chart .carea{fill:rgba(18,163,137,.12)}
.chart .cp{fill:#fff;stroke:var(--brand);stroke-width:2}
.chart .cb{fill:var(--brand)}
.chart .cbv{fill:var(--brand);font-size:10px;font-family:Vazirmatn;font-weight:700}
.hbar{margin-bottom:11px}
.hbar .lab{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:3px}
.hbar .lab b{color:var(--brand)}
.hbar .tr2{height:9px;background:#edf1f7;border-radius:99px;overflow:hidden}
.hbar .tr2 i{display:block;height:100%;border-radius:99px;background:var(--brand)}
.hbar.gold .tr2 i{background:var(--accent)}.hbar.blue .tr2 i{background:#33549e}.hbar.gray .tr2 i{background:#8a97ab}.hbar.best .tr2 i{background:linear-gradient(90deg,var(--brand),var(--brand2))}
#modal-root{position:fixed;inset:0;background:rgba(13,22,38,.55);backdrop-filter:blur(3px);z-index:110;display:none;align-items:center;justify-content:center;padding:20px}
#modal-root.on{display:flex}
.modal{background:#fff;border-radius:18px;max-width:640px;width:100%;max-height:88vh;overflow:auto;padding:24px;animation:fadeUp .3s}
.modal h3{font-size:16.5px;margin-bottom:6px}
#toast-root{position:fixed;bottom:20px;right:50%;transform:translateX(50%);z-index:130;display:flex;flex-direction:column;gap:8px;align-items:center;max-width:92vw}
.toast{background:var(--dark);color:#fff;padding:10px 20px;border-radius:12px;font-size:13px;box-shadow:0 10px 30px rgba(0,0,0,.3);animation:fadeUp .3s}
#errbar{position:fixed;top:0;right:0;left:0;background:var(--danger);color:#fff;padding:8px 16px;font-size:12px;z-index:200;display:none}
.codebox{background:var(--dark);color:#5fd6bf;border-radius:12px;padding:12px;text-align:center;font-size:24px;font-weight:800;letter-spacing:8px;direction:ltr;margin:10px 0}
.ba{position:relative;border-radius:14px;overflow:hidden;height:220px;user-select:none;margin:8px 0}
.ba .layer{position:absolute;inset:0}
.ba .cap{position:absolute;bottom:8px;right:10px;background:rgba(13,22,38,.7);color:#fff;font-size:10.5px;padding:3px 10px;border-radius:99px;z-index:4}
.ba .after{clip-path:inset(0 0 0 45%)}
.ba .handle{position:absolute;top:0;bottom:0;width:3px;background:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.15);left:55%;z-index:5}
.ba input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:ew-resize;z-index:6}
.mk{position:absolute;width:26px;height:26px;border-radius:50%;background:var(--danger);border:3px solid #fff;display:grid;place-items:center;color:#fff;font-size:12px;font-weight:800;cursor:help;box-shadow:0 2px 8px rgba(0,0,0,.35);z-index:4}
.mk:hover::after{content:attr(data-tip);position:absolute;bottom:130%;right:-10px;background:var(--dark);color:#fff;font-size:11px;padding:6px 12px;border-radius:8px;white-space:nowrap;z-index:9}
.chero{background:radial-gradient(800px 340px at 85% -10%,rgba(18,163,137,.35),transparent),var(--dark);border-radius:22px;padding:22px}
.ch{max-width:1020px;margin:auto;background:#fff;border-radius:18px;overflow:hidden;display:flex;flex-direction:column;height:600px}
.ch-h{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.ch-h .av{width:42px;height:42px;border-radius:13px;background:var(--soft);display:grid;place-items:center;font-size:21px}
.ch-h b{font-size:15px;display:block}
.ch-h small{font-size:12px;color:var(--muted);display:block}
.ch-b{flex:1;overflow-y:auto;padding:16px;background:#f7fafc;display:flex;flex-direction:column;gap:10px}
.msg{display:flex;max-width:95%}
.msg.bot{align-self:flex-start}
.msg.user{align-self:flex-end}
.msg .bub{background:#fff;border:1px solid var(--line);border-radius:12px 12px 12px 4px;padding:10px 14px;font-size:13px;line-height:1.9}
.msg.user .bub{background:var(--brand);color:#fff;border:none;border-radius:12px 12px 4px 12px}
.qr{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.qr button{background:#fff;border:1px solid var(--bline);color:var(--brand);border-radius:99px;padding:6px 12px;font-size:12px;cursor:pointer;font-family:inherit;font-weight:600}
.qr button:hover{background:var(--soft)}
.ch-in{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line);background:#fff}
.ch-in input{flex:1;border:1px solid var(--line);border-radius:10px;padding:11px 13px;font-family:inherit;font-size:13.5px}
.ch-in button{background:var(--brand);color:#fff;border:none;border-radius:10px;padding:11px 24px;font-family:inherit;font-weight:700;cursor:pointer;font-size:14px}
.chcards{display:grid;grid-template-columns:1fr;gap:8px;margin-top:8px}
.ccard{border:1px solid var(--line);border-radius:12px;padding:9px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:#fff}
.ccard .cthumb{width:74px;height:54px;border-radius:8px;overflow:hidden;flex:none}
.ccard .cthumb img{width:100%;height:100%;object-fit:cover}
.ccard .cb{flex:1;min-width:150px}
.ccard .cb b{font-size:12.5px;display:block}
.ccard .cb small{font-size:10.8px;color:var(--muted);display:block}
.ccard .btns{display:flex;gap:5px;flex-wrap:wrap}
.ctbl{width:100%;border-collapse:collapse;font-size:11.5px;margin-top:6px}
.ctbl th,.ctbl td{border:1px solid var(--line);padding:4px 6px;text-align:center}
.ctbl th{background:#f8fafc}
#fcbfab{position:fixed;bottom:20px;left:20px;z-index:95;width:54px;height:54px;border-radius:50%;border:none;background:linear-gradient(135deg,var(--brand2),var(--brand));color:#fff;cursor:pointer;box-shadow:0 12px 30px rgba(14,124,107,.45);display:none;font-size:22px}
#fcbfab.on{display:grid;place-items:center}
.fchw{position:fixed;bottom:20px;left:20px;z-index:100;width:380px;max-width:calc(100vw - 32px);height:520px;max-height:calc(100vh - 40px);background:#fff;border-radius:18px;box-shadow:0 24px 60px rgba(13,22,38,.35);display:none;flex-direction:column;overflow:hidden}
.fchw.on{display:flex}
.fch-h{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);font-weight:800;font-size:13.5px}
.fch-h button{margin-inline-start:auto;background:none;border:none;font-size:20px;cursor:pointer;color:var(--muted);line-height:1}
.fch-b{flex:1;overflow-y:auto;padding:12px;background:#f7fafc;display:flex;flex-direction:column;gap:9px}
.fch-in{display:flex;gap:8px;padding:9px;border-top:1px solid var(--line)}
.fch-in input{flex:1;border:1px solid var(--line);border-radius:10px;padding:9px 11px;font-family:inherit;font-size:12.5px}
.fch-in button{background:var(--brand);color:#fff;border:none;border-radius:10px;padding:9px 16px;font-family:inherit;font-weight:700;cursor:pointer}
.vrow{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:13px}
.vrow:last-child{border:none}
.vrow .vt{flex:1}
.vrow.ok .vt{text-decoration:line-through;color:var(--muted)}
.cbx{width:20px;height:20px;border-radius:6px;border:1.5px solid #c6d2e0;display:grid;place-items:center;cursor:pointer;background:#fff;color:transparent;font-size:11px;flex:none}
.cbx.on{background:var(--ok);border-color:var(--ok);color:#fff}
.vdel{border:none;background:none;color:#c6d2e0;font-size:16px;cursor:pointer;line-height:1}
.vdel:hover{color:var(--danger)}
.signer{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;background:#fbfcfe}
.signer .sh{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:13px;margin-bottom:6px;gap:8px;flex-wrap:wrap}
.otp{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.otp input{flex:1;min-width:120px;direction:ltr;text-align:center;letter-spacing:4px}
.dots{display:inline-flex;gap:4px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--brand2);animation:bl 1s infinite}
.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
@keyframes bl{0%,80%,100%{opacity:.2}40%{opacity:1}}
.rail{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 10px}

.kpad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}

.cmpbar{margin-top:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--soft);border:1px solid var(--bline);border-radius:12px;padding:10px 14px}

#lfm{height:460px;border-radius:12px;border:1px solid var(--line);z-index:1}

footer b{color:#fff}
footer .fl{display:block;padding:3px 0;cursor:pointer}
footer .fl:hover{color:#5fd6bf}
</style>

</div></footer>

<div id="modal-root"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
/* ═══ ۱) ابزار ═══ */
function $(s){return document.querySelector(s)}
function $$(s){return Array.prototype.slice.call(document.querySelectorAll(s))}
function fa(n,d){if(d===undefined)d=1;if(isNaN(n))n=0;return Number(n).toLocaleString('fa-IR',{maximumFractionDigits:d})}
function faI(n){if(isNaN(n))n=0;return Math.round(n).toLocaleString('fa-IR')}
function mn(v){if(v>=1000)return fa(v/1000,2)+' میلیارد ریال';return fa(v,0)+' میلیون ریال'}
function mn2(a){if(a>=1e9)return fa(a/1e9,2)+' میلیارد ریال';if(a>=1e6)return fa(a/1e6)+' میلیون ریال';return fa(a)+' ریال'}
function wShort(a){if(a>=1e9)return fa(a/1e9,1)+' میلیارد ریال';if(a>=1e6)return fa(a/1e6)+' میلیون ریال';return fa(a)+' ریال'}
function dt(t){try{return new Date(t).toLocaleDateString('fa-IR',{month:'long',day:'numeric'})}catch(e){return ''}}
function now(){return Date.now()}
function esc(t){return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;')}
function qesc(t){return esc(t).replace(/"/g,'&quot;')}
var PD={'۰':'0','۱':'1','۲':'2','۳':'3','۴':'4','۵':'5','۶':'6','۷':'7','۸':'8','۹':'9'};
function pd(s){return String(s).replace(/[۰-۹]/g,function(c){return PD[c]})}
window.onerror=function(m){var e=document.getElementById('errbar');if(e){e.style.display='block';e.textContent='خطای اسکریپت: '+m}return false};
function ph(seed,w,h,fb){return '<div class="ph"><div class="fb">'+fb+'</div><img src="https://picsum.photos/seed/'+seed+'/'+w+'/'+h+'" alt="" loading="lazy" onerror="this.remove()"></div>'}
function starsN(n){var s='';for(var i=0;i<5;i++)s+=(i<n?'★':'☆');return '<span class="stars2">'+s+'</span>'}

/* ═══ ۲) وضعیت ═══ */
var LSKEY='khanyar_v11';
var S=null;
try{S=JSON.parse(localStorage.getItem(LSKEY))}catch(e){S=null}
if(!S||typeof S!=='object')S={};
if(S.auth===undefined)S.auth=null;
if(S.tokens===undefined)S.tokens=0;
if(S.wallet===undefined)S.wallet=0;
if(S.welcomed===undefined)S.welcomed=false;
if(S.pending===undefined)S.pending=null;
if(!S.prof)S.prof={work:null,school:null};
if(!S.wlog)S.wlog=[];
if(!S.log)S.log=[];
if(!S.reqs)S.reqs=[];
if(!S.flow)S.flow={};
if(!S.contracts)S.contracts=[];
if(!S.reviews)S.reviews=[];
if(!S.ui)S.ui={tab:'b'};
function save(){try{localStorage.setItem(LSKEY,JSON.stringify(S))}catch(e){}}

/* ═══ ۳) توکن + کیف پول ═══ */
var COSTS={detail:10,visit:20,valuation:40,legal:100,contract:150,escrow:150,bid:20,stay:30};
var COSTL={detail:'جزئیات راستی‌آزمایی‌شدهٔ آگهی',visit:'هماهنگی بازدید',valuation:'تخمین ارزش',legal:'گزارش حقوقی ملک',contract:'ثبت اجاره‌نامهٔ دیجیتال',escrow:'مبایعهٔ امانی',bid:'ارسال پیشنهاد پیمانکاری',stay:'رزرو امانی اقامتگاه'};
function renderTok(){
  var el=$('#tokchip');if(!el)return;
  if(S.auth){el.innerHTML='<button class="tok" data-act="wallet"><span>💳</span><b>'+wShort(S.wallet||0)+'</b></button><div class="tok"><span>🪙</span><b>'+fa(S.tokens)+'</b><span>توکن</span></div><button class="btn btn-xs" data-view="sub">شارژ</button>'}
  else{el.innerHTML='<button class="btn btn-xs" data-view="auth" style="background:#fff">ورود</button>'}
  var fb=$('#fcbfab');if(fb)fb.className=S.auth?'on':'';
}
function spend(key,cat,desc){
  var c=COSTS[key]||0;
  if(S.tokens<c){
    openModal('<h3>🪙 توکن کافی نیست</h3><p class="note">این خدمت '+fa(c)+' توکن لازم دارد؛ موجودی شما '+fa(S.tokens)+' توکن است.</p><div style="display:flex;gap:8px;margin-top:14px"><button class="btn btn-primary" data-view="sub">شارژ توکن</button><button class="btn" data-act="closeModal">بستن</button></div>');
    return false;
  }
  S.tokens-=c;S.log.unshift({t:now(),d:desc,c:-c,cat:cat});save();renderTok();
  toast('−'+fa(c)+' 🪙 — '+desc);return true;
}
function earn(n,cat,desc){S.tokens+=n;S.log.unshift({t:now(),d:desc,c:n,cat:cat});save();renderTok();toast('+'+fa(n)+' 🪙 — '+desc)}
function walletIn(a,d){S.wallet=(S.wallet||0)+a;S.wlog.unshift({t:now(),d:d,a:a});save();renderTok();toast('💳 '+mn2(a)+' به کیف پول واریز شد')}
function addReq(cat,type,title,status,detail){
  var id='R'+now()+Math.floor(Math.random()*999);
  S.reqs.unshift({id:id,cat:cat,type:type,title:title,status:status||'در انتظار',t:now(),detail:detail||''});
  save();return id;
}
function setReq(id,st){for(var i=0;i<S.reqs.length;i++){if(S.reqs[i].id===id){S.reqs[i].status=st;save();return}}}
function statusBadge(s){var m={'در انتظار':'b-warn','تأیید شد':'b-ok','در حال انجام':'b-info','کامل شد':'b-ok','لغو شد':'b-bad'};return '<span class="badge '+(m[s]||'b-info')+'">'+s+'</span>'}

/* ═══ ۴) توست/مودال ═══ */
function toast(msg){var t=document.createElement('div');t.className='toast';t.textContent=msg;$('#toast-root').appendChild(t);setTimeout(function(){if(t.parentNode)t.parentNode.removeChild(t)},3400)}
function openModal(html,cb){var r=$('#modal-root');r.innerHTML='<div class="modal">'+html+'</div>';r.classList.add('on');r.onclick=function(e){if(e.target===r)closeModal()};if(cb)cb()}
function closeModal(){var r=$('#modal-root');r.classList.remove('on');r.innerHTML=''}

/* ═══ ۵) نمودار ═══ */
function spark(host,data,labels,fmt){
  if(!host)return;fmt=fmt||function(v){return fa(v)};
  var w=600,h=190,pL=46,pR=8,pT=16,pB=22,n=data.length;
  var lo=Math.min.apply(null,data)*0.96,hi=Math.max.apply(null,data)*1.05;
  function X(i){return pL+(w-pL-pR)*i/(n-1)}
  function Y(v){return pT+(h-pT-pB)*(1-(v-lo)/(hi-lo))}
  var g='';
  for(var t=0;t<=3;t++){var v=lo+(hi-lo)*t/3,y=Y(v);g+='<line x1="'+pL+'" y1="'+y+'" x2="'+(w-pR)+'" y2="'+y+'" class="cg"/><text x="'+(w-pR)+'" y="'+(y-4)+'" class="cl" text-anchor="end">'+fmt(v)+'</text>'}
  if(labels){var idx=[0,Math.round(n/3),Math.round(2*n/3),n-1];for(var q=0;q<idx.length;q++){var i2=idx[q];if(i2>=0&&i2<n)g+='<text x="'+X(i2)+'" y="'+(h-4)+'" class="xl" text-anchor="middle">'+labels[i2]+'</text>'}}
  var path='',pts='';
  for(var i=0;i<n;i++){path+=(i?'L':'M')+X(i).toFixed(1)+' '+Y(data[i]).toFixed(1)+' '}
  for(var j=0;j<n;j++){pts+='<circle cx="'+X(j).toFixed(1)+'" cy="'+Y(data[j]).toFixed(1)+'" r="3.2" class="cp"/>'}
  var area=path+'L'+X(n-1).toFixed(1)+' '+(h-pB)+' L'+X(0).toFixed(1)+' '+(h-pB)+' Z';
  host.innerHTML='<svg viewBox="0 0 '+w+' '+h+'" class="chart">'+g+'<path d="'+area+'" class="carea"/><path d="'+path+'" class="cline"/>'+pts+'</svg>';
}
function bars(host,data,labels,fmt){
  if(!host)return;fmt=fmt||function(v){return fa(v)};
  var w=600,h=180,pL=40,pR=8,pT=16,pB=22,n=data.length;
  var hi=Math.max.apply(null,data)*1.15,bw=(w-pL-pR)/n*0.55;
  function X(i){return pL+(w-pL-pR)*(i+0.5)/n}
  function Y(v){return pT+(h-pT-pB)*(1-v/hi)}
  var g='',b='';
  for(var t=0;t<=3;t++){var v=hi*t/3,y=Y(v);g+='<line x1="'+pL+'" y1="'+y+'" x2="'+(w-pR)+'" y2="'+y+'" class="cg"/><text x="'+(w-pR)+'" y="'+(y-4)+'" class="cl" text-anchor="end">'+fmt(v)+'</text>'}
  for(var i=0;i<n;i++){
    b+='<rect x="'+(X(i)-bw/2).toFixed(1)+'" y="'+Y(data[i]).toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+(h-pB-Y(data[i])).toFixed(1)+'" rx="4" class="cb"/>';
    b+='<text x="'+X(i).toFixed(1)+'" y="'+(Y(data[i])-5).toFixed(1)+'" class="cbv" text-anchor="middle">'+fmt(data[i])+'</text>';
    if(labels)b+='<text x="'+X(i).toFixed(1)+'" y="'+(h-4)+'" class="xl" text-anchor="middle">'+labels[i]+'</text>';
  }
  host.innerHTML='<svg viewBox="0 0 '+w+' '+h+'" class="chart">'+g+b+'</svg>';
}
var M3=['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'].map(function(m){return m.slice(0,3)});

/* ═══ ۶) داده‌ها (میلیون ریال) ═══ */
var MODBY={rent:{v:'rent',t:'اجاره'},buy:{v:'buy',t:'خرید'},invb:{v:'invest',t:'سهم متری'},invr:{v:'invest',t:'درآمد اجاره'},mkt:{v:'mkt',t:'پروژه‌ها'},build:{v:'build',t:'ساخت و تأمین'},stay:{v:'stay',t:'اقامتگاه'}};
var WD=['شنبه','یک‌شنبه','دوشنبه','سه‌شنبه','چهارشنبه','پنج‌شنبه','جمعه'];
var HOODS=[
 {id:'hood1',n:'سعادت‌آباد',avgRent:65,avgDep:3000,buyBase:730,newBase:870,work:15,metro:400,school:200,saf:4.5,amn:4.6,quiet:3.6,ads:1420,tx:384,days:52,x:10,y:20,ll:[35.777,51.367]},
 {id:'hood2',n:'پونک',avgRent:55,avgDep:3500,buyBase:520,newBase:630,work:25,metro:250,school:800,saf:4.4,amn:4.3,quiet:4.1,ads:980,tx:610,days:41,x:5,y:25,ll:[35.760,51.332]},
 {id:'hood3',n:'ستارخان',avgRent:68,avgDep:2000,buyBase:610,newBase:740,work:18,metro:700,school:150,saf:4.1,amn:4.6,quiet:3.0,ads:860,tx:520,days:47,x:8,y:12,ll:[35.738,51.355]},
 {id:'hood4',n:'شهران',avgRent:74,avgDep:4000,buyBase:550,newBase:660,work:35,metro:1500,school:300,saf:4.6,amn:4.2,quiet:4.6,ads:640,tx:470,days:38,x:4,y:30,ll:[35.762,51.302]},
 {id:'hood5',n:'جردن',avgRent:90,avgDep:4500,buyBase:950,newBase:1120,work:12,metro:900,school:350,saf:4.8,amn:4.7,quiet:3.4,ads:520,tx:210,days:63,x:12,y:18,ll:[35.796,51.412]},
 {id:'hood6',n:'نارمک',avgRent:52,avgDep:2200,buyBase:470,newBase:580,work:28,metro:300,school:250,saf:4.3,amn:4.4,quiet:4.2,ads:730,tx:640,days:33,x:9,y:8,ll:[35.741,51.508]}
];
function findH(id){for(var i=0;i<HOODS.length;i++){if(HOODS[i].id===id)return HOODS[i]}return HOODS[0]}
function wTime(h){if(S.prof&&S.prof.work){var w=findH(S.prof.work);return Math.max(5,Math.round((Math.abs(h.x-w.x)+Math.abs(h.y-w.y))*2.2+6))}return h.work}
function sTime(h){if(S.prof&&S.prof.school){var s=findH(S.prof.school);return Math.max(3,Math.round((Math.abs(h.x-s.x)+Math.abs(h.y-s.y))*1.6+4))}return Math.round(h.school/80)}
function wLabel(){return S.prof&&S.prof.work?' (از محل کار شما: '+findH(S.prof.work).n+')':''}
function hCats(h){
 var sd=(h.x*7+h.y*13);
 function r(b){return Math.max(1,Math.min(5,Math.round(b+((sd*7)%3)-1)))}
 return [
  {t:'دسترسی و امنیت',ic:'🛡️',rows:[['مترو و قطار شهری',r(5-Math.min(3,h.metro/400))],['ایستگاه اتوبوس / BRT',r(h.amn+1)],['دسترسی به بزرگراه',r(h.amn)],['امنیت شبانه',h.saf],['روشنایی و نگهداری معابر',r(h.saf-1)]]},
  {t:'معاملات مالی و خرید',ic:'💳',rows:[['شعبهٔ بانک و صرافی',r(h.amn)],['دستگاه خودپرداز',r(h.amn+1)],['فروشگاه و سوپرمارکت',h.amn],['مرکز خرید',r(h.amn-1)]]},

function wd(m){if(!S.flow[m])S.flow[m]={step:1,data:{},done:false};return S.flow[m]}
function stepper(m){
  var st=WSTEPS[m],d=wd(m),cur=d.step;
  return '<div class="steps">'+st.map(function(s,i){
    var n=i+1,cls=(d.done||n<cur)?'done':(n===cur?'cur':'');
    var attr=(n<cur&&!d.done)?' data-jump="'+n+'" data-m="'+m+'" style="cursor:pointer"':'';
    return '<div class="st '+cls+'"'+attr+'><span class="stn">'+(cls==='done'?'✓':fa(n))+'</span><b>'+s+'</b></div>';
  }).join('')+'</div>';
}
function wtop(m,title,sub){var d=wd(m);return '<div class="wtop"><div><h2>'+title+'</h2><p>'+sub+'</p></div><span class="wprog">مرحلهٔ '+fa(d.step)+' از '+fa(WSTEPS[m].length)+'</span><button class="btn btn-xs" data-act="fcb">💬 دستیار</button></div>'+stepper(m)}
function wnav(m,canNext,noteTxt){

function hv(h,k){
  if(k==='metro')return Math.max(0,1-(h.metro-100)/1400);
  if(k==='school')return Math.max(0,1-(h.school-100)/1400);
  if(k==='work')return Math.max(0,1-(wTime(h)-8)/45);
  if(k==='saf')return h.saf/5;
  if(k==='amn')return h.amn/5;
  if(k==='quiet')return h.quiet/5;
  return .5;
}
function hoodScore(h,P){
  var ks=['metro','school','work','saf','amn','quiet'],tw=0,s=0;
  ks.forEach(function(k){tw+=P[k];s+=P[k]*hv(h,k)});
  var ex=P.extra||[];
  if(ex.length){var PX=(P.PXH||{})[h.id]||[];ex.forEach(function(e,i){tw+=e.w;s+=(PX[i]?1:0)*e.w})}
  return Math.max(5,Math.min(100,Math.round((tw?s/tw:.5)*100)));
}

function blPass(x,D){
  var P=D.PR;
  if(x.age<P.age[0]||x.age>P.age[1])return false;
  if(x.m2<P.m2[0]||x.m2>P.m2[1])return false;
  if(x.ppm<P.ppm[0]||x.ppm>P.ppm[1])return false;
  if(x.beds<P.beds)return false;
  if(P.floor==='low'&&x.floor>3)return false;
  if(P.floor==='high'&&x.floor<4)return false;
  if(P.elev==='yes'&&!x.elev)return false;
  if(P.park==='yes'&&!x.park)return false;
  if(P.balc==='yes'&&!x.balc)return false;
  return true;
}
function bScore(x,D){
  var s=50;
  if(x.age<=3)s+=10;else if(x.age<=10)s+=5;
  if(x.beds>D.PR.beds)s+=3;
  if(x.elev)s+=3;if(x.park)s+=3;if(x.balc)s+=2;
  var h=findH(x.hood);s+=Math.round(hoodScore(h,D.P)/12);
  return Math.min(98,Math.round(s));
}

function lscore(x,D){
  var s=50;
  if(x.rent<=D.B.rentB)s+=18;else s-=Math.min(15,(x.rent-D.B.rentB)*0.8);
  if(x.age<=D.P.maxAge)s+=8;else s-=6;
  if(x.m2>=D.P.minM2)s+=8;else s-=5;
  if(x.beds>=D.P.beds)s+=4;
  if(D.P.floor==='low'&&x.floor<=3)s+=5;
  if(D.P.floor==='high'&&x.floor>=4)s+=5;
  if(D.P.elev&&x.elev)s+=3;
  if(D.P.park&&x.park)s+=3;
  s+=Math.round(hoodScore(findH(x.hood),D.P)/15);
  return Math.max(25,Math.min(98,Math.round(s)));
}

var HIST=[];
var CE={f:null,i:0,li:0};
function botC(html,chips){HIST.push({r:'bot',h:html,c:chips||null});if(HIST.length>60)HIST=HIST.slice(-60);cr()}
function usrC(t){HIST.push({r:'user',h:esc(t)});cr()}
function cr(){
  var last=-1;
  for(var i=HIST.length-1;i>=0;i--){if(HIST[i].r==='bot'&&HIST[i].c){last=i;break}}
  [{el:$('#chatB')},{el:$('#fchB')}].forEach(function(b){
    if(!b.el)return;
    b.el.innerHTML=HIST.map(function(m,ix){
      var h='<div class="msg '+m.r+'"><div class="bub">'+m.h;
      if(m.r==='bot'&&m.c&&ix===last){h+='<div class="qr">'+m.c.map(function(c){return '<button data-cv="'+qesc(c[1])+'">'+c[0]+'</button>'}).join('')+'</div>'}
      return h+'</div></div>';
    }).join('');
    b.el.scrollTop=b.el.scrollHeight;
  });
}
function ceStart(f){CE.f=f;CE.i=0;CE.li=0;ceStep()}
function ceJump(id){
  if(!CE.f)return;
  var sc=SCRIPTS[CE.f];
  for(var j=0;j<sc.length;j++){if(sc[j].id===id){CE.i=j;CE.li=0;ceStep();return}}
}
function ceStep(){
  if(!CE.f)return;
  var sc=SCRIPTS[CE.f];
  if(CE.i>=sc.length){ceEnd();return}
  var st=sc[CE.i],D=wd(CE.f).data;
  if(st.pre&&st.pre(D)===false){CE.i++;ceStep();return}
  if(st.loop){
    var it=st.loop[Math.min(CE.li,st.loop.length-1)];
    botC(it.t,CHIP5());
    return;
  }
  var q=typeof st.q==='function'?st.q(D):st.q;
  if(st.cards)q+='<div class="chcards">'+st.cards(D)+'</div>';
  var chips=st.chips?st.chips(D):null;
  botC(q,chips);
}
function CHIP5(){return [['۱','1'],['۲','2'],['۳','3'],['۴','4'],['۵','5'],['پیش‌فرض','DEF']]}
function ceVal(v,label){
  if(v==='!menu'){ceStart('gate');CE.i=3;ceStep();return}
  if(v==='!help'){
    botC('فرمان‌های مفید: «ادامه»، «بازگشت»، «محله‌ها»، «مقایسه»، «امضا»، «فسخ»، «چند توکن دارم»، «کیف پول»، «نقشه»، «منو». در هر مرحله، دکمه‌های پیشنهادی زیر آخرین پیام فعال‌اند.',[['منوی اصلی','!menu']]);
    return;
  }
  if(v&&v.indexOf('F:')===0){if(v.slice(2)==='dashx'){go('dash');return}ceStart(v.slice(2));return}
  if(!CE.f){botC('از منوی اصلی شروع کنید:',[['منوی اصلی','!menu']]);return}
  var sc=SCRIPTS[CE.f],st=sc[CE.i],D=wd(CE.f).data;
  if(v&&v[0]==='!'&&st.acts&&st.acts[v.slice(1)]){st.acts[v.slice(1)](D);return}
  if(st.loop){
    var it=st.loop[CE.li];
    if(v!=='DEF'){D.P=D.P||{};D.P[it.k]=Math.max(1,Math.min(5,+pd(v)||3))}
    CE.li++;
    if(CE.li<st.loop.length){botC(st.loop[CE.li].t,CHIP5());return}
    CE.i++;CE.li=0;save();renderCurrent();ceStep();return;
  }
  var done=null;
  if(st.set){done=st.set(D,v,label)}
  else if(st.key){D[st.key]=isNaN(+v)?v:+v}
  if(done==='ERR'){botC('⚠️ ورودی نامعتبر — دوباره تلاش کنید یا از دکمه‌ها انتخاب کنید.');return}
  if(st.until){
    if(done==='DONE'){CE.i++;save();renderCurrent();ceStep()}
    else{save();botC('✓ اضافه شد. مورد دیگر؟ (یا «تمام»)',[['تمام','تمام']])}
    return;
  }
  CE.i++;CE.li=0;save();renderCurrent();ceStep();
}
function ceEnd(){
  var f=CE.f;CE.f=null;
  botC('🎉 <b>فلوی '+MODBY[f].t+' کامل شد.</b> در داشبورد ثبت شد.',[['منوی اصلی','!menu'],['داشبورد','F:dashx']]);
}
function ceSend(t){
  t=(t||'').trim();if(!t)return;
  var st=CE.f?SCRIPTS[CE.f][CE.i]:null;
  if(st&&(st.kind==='text'||st.kind==='num')){usrC(t);ceVal(t,t);return}
  usrC(t);
  var n=pd(t).replace(/[يى]/g,'ی').trim();
  var nn=t.replace(/[يى]/g,'ی');
  if(/^(ادامه|بعدی|مرحله بعد)/.test(n)){
    if(st&&st.chips){var c=st.chips(wd(CE.f).data);botC('از گزینه‌های پیشنهادی همین مرحله انتخاب کنید:',c);return}
    botC('در این مرحله از دکمه‌های پیشنهادی استفاده کنید.',[['منوی اصلی','!menu']]);return;
  }
  if(/توکن/.test(nn)){CBT.tok();return}
  if(/کیف پول/.test(nn)){ACT.wallet();return}
  if(/فسخ/.test(nn)&&CE.f==='rent'&&wd('rent').data.signed){ceJump('termq');return}
  if(/امضا/.test(nn)&&CE.f==='rent'){ceJump('ctr0');return}
  if(/^(محله|محله‌ها)/.test(nn)&&(CE.f==='rent'||CE.f==='buy')){ceJump('hoods');return}
  if(/مقایسه/.test(nn)&&(CE.f==='rent'||CE.f==='buy')){ceJump('hoods');return}
  if(/نقشه/.test(nn)){go('map');return}
  if(/راهنما|کمک/.test(nn)){ceVal('!help');return}
  if(/منو/.test(nn)){ceVal('!menu');return}
  if(/داشبورد/.test(nn)){go('dash');return}
  botC('متوجه نشدم 🤔 — «راهنما» را بزنید یا از دکمه‌های پیشنهادی استفاده کنید.',[['راهنما','!help'],['منوی اصلی','!menu']]);
}

  return{rent:rent,depNeed:depNeed,mon:rent+D.B.chg,ratio:(rent+D.B.chg)/D.B.inc};

function fbPins(){

function mkMap(elId,center,zoom){
  var el=document.getElementById(elId);if(!el)return null;
  if(!window.L){el.innerHTML='<div class="mapfb">'+fbPins()+'</div>';return null}
  if(MAPS[elId]){try{MAPS[elId].remove()}catch(e){}}
  var m=L.map(elId).setView(center,zoom);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18,attribution:'© OpenStreetMap'}).addTo(m);
  MAPS[elId]=m;return m;
}

var CJMP=0,CJMS=0;
function renderCJM(){
  var el=$('#v-cjm');
  var total=0,pains=0,opps=0;
  CJM.forEach(function(p){total+=p.stages.length;p.stages.forEach(function(s){pains+=s.pn.length;opps+=s.op.length})});
  var P=CJM[CJMP],stg=P.stages[CJMS];
  var h='<div class="wtop"><div><h2>بوم سفر مشتری</h2><p>۷ پرسونا / '+fa(total)+' مرحله / '+fa(pains)+' درد / '+fa(opps)+' فرصت</p></div></div>';
  h+='<div class="chips" style="margin-bottom:12px">'+CJM.map(function(p,i){return '<span class="chip'+(i===CJMP?' on':'')+'" data-act="cjmp" data-p="'+i+'">'+p.name+'</span>'}).join('')+'</div>';
  h+='<div class="rail">'+P.stages.map(function(s,i){return '<button class="'+(i===CJMS?'on':'')+'" data-act="cjms" data-s="'+i+'"><span class="n">'+fa(i+1)+'</span>'+s.n+'</button>'}).join('')+'</div>';
  h+='<div class="cjm-th">«'+stg.th+'」</div><div class="cjm-ins"><b>بینش:</b> '+stg.ins+'</div>';
  h+='<div class="lyr red"><h4>نقاط درد</h4><ul>'+(stg.pn.length?stg.pn.map(function(x){return '<li>• '+x+'</li>'}).join(''):'<li>—</li>')+'</ul></div>';
  h+='<div class="lyr green"><h4>فرصت‌ها</h4><ul>'+(stg.op.length?stg.op.map(function(x){return '<li>✓ '+x+'</li>'}).join(''):'<li>—</li>')+'</ul></div>';
  h+='<button class="btn btn-primary" style="margin-top:14px" data-view="'+P.view+'">فلوهای این پرسونا ←</button>';
  el.innerHTML=h;
}

/* ═══ ۲۲) رویدادها و راه‌اندازی ═══ */
document.addEventListener('click',function(e){
  var t=e.target;
  if(!t||!t.closest)return;
  var cv=t.closest('[data-cv]');
  if(cv){var lab=cv.textContent.trim();usrC(lab);ceVal(cv.getAttribute('data-cv'),lab);return}
  var cf=t.closest('[data-cf]');
  if(cf){usrC(cf.textContent.trim());ceStart(cf.getAttribute('data-cf'));return}
  var cba=t.closest('[data-cba]');
  if(cba){var f2=CBACT[cba.getAttribute('data-cba')];if(f2)f2(cba);return}
  var w=t.closest('[data-w]');
  if(w){wizardNav(w.getAttribute('data-m'),w.getAttribute('data-w'));return}
  var j=t.closest('[data-jump]');
  if(j){jumpTo(j.getAttribute('data-m'),+j.getAttribute('data-jump'));return}
  var a=t.closest('[data-act]');
  if(a){var f=ACT[a.getAttribute('data-act')];if(f){f(a,e)}return}
  var v=t.closest('[data-view]');
  if(v){go(v.getAttribute('data-view'))}
});
/* ورودی متنی برای اعداد: سینک اسلایدر↔متن + فیلد مبلغ پرداخت */
document.addEventListener('input',function(e){
  var t=e.target;
  if(!t||!t.hasAttribute)return;
  if(t.hasAttribute('data-paytxt')){
    var dg=pd(t.value).replace(/[^\d]/g,'').slice(0,13);
    t.value=dg;
    var amt=+dg||0;
    var rate=PAYM.ctx?PAYM.ctx.rate:1,unit=PAYM.ctx?PAYM.ctx.unit:'';
    var fee=Math.round(amt*0.005);
    var eA=document.getElementById('pay-amt');if(eA)eA.textContent=fa(amt)+' ریال';
    var eU=document.getElementById('pay-units');if(eU)eU.textContent=fa(Math.floor(amt/rate))+' '+unit;
    var eF=document.getElementById('pay-fee');if(eF)eF.textContent=fa(fee)+' ریال';
    var eT=document.getElementById('pay-total');if(eT)eT.textContent=fa(amt+fee)+' ریال';
    if(PAYM.mode==='invb'){wd('invb').data.payAmt=dg;save()}
    else if(PAYM.ctx)PAYM.amt=dg;
    return;
  }
  if(t.hasAttribute('data-tk')){
    var k=t.getAttribute('data-tk');
    var row=t.closest('.srow');
    var rg=row?row.querySelector('[data-rk="'+k+'"]'):null;
    var v=pd(t.value).replace(/[^\d.]/g,'');
    if(rg&&v!==''){
      var n=+v;
      if(!isNaN(n)){
        var mn2v=+rg.min,mx=+rg.max;
        n=Math.max(mn2v,Math.min(mx,n));
        rg.value=n;
        try{rg.dispatchEvent(new Event('input'))}catch(e2){}
      }
    }
    return;
  }
  if(t.hasAttribute('data-rk')){
    var k2=t.getAttribute('data-rk');
    var row2=t.closest('.srow');
    var tx=row2?row2.querySelector('[data-tk="'+k2+'"]'):null;
    if(tx)tx.value=t.value;
  }
});
try{
  renderSidebar();renderTok();
  if(S.auth){var p=S.pending||'dash';S.pending=null;save();go(p)}
  else go('landing');
}catch(e2){
  toast('خطای راه‌اندازی: '+e2.message);
  var lv=document.querySelector('#v-landing');
  if(lv&&!document.querySelector('.view.on'))lv.classList.add('on');
}
