<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>خانه‌یار</title>
<style>

  @font-face {
    font-family: 'IRANSansX';
    src: url('./IRANSansX-Regular.woff2') format('woff2');
    font-weight: normal;
    font-style: normal;
    font-display: swap;
  }

  @font-face {
    font-family: 'IRANSansX';
    src: url('./IRANSansX-Bold.woff2') format('woff2');
    font-weight: 700;
    font-style: normal;
    font-display: swap;
  }

  *, button, input, select {
    font-family: 'IRANSansX', sans-serif !important;
  }
:root{--bg:#f4f6fa;--surface:#ffffff;--surface-2:#f8fafc;--ink:#0f1e33;--ink2:#3d4a5f;--muted:#66758b;--faint:#93a0b4;--line:#e4eaf2;--line-soft:#eef2f8;--brand:#0e7c6b;--brand-strong:#0a5f53;--brand2:#12a389;--brand-ink:#0b5a4d;--soft:#e6f5f1;--bline:#bfe5dd;--accent:#d9942a;--accent-strong:#a06a12;--asoft:#fdf3e3;--danger:#d9534f;--dsoft:#fdecec;--ok:#1f9d55;--osoft:#e9f7ef;--info:#33549e;--info-soft:#eef3fd;--dark:#0d1626;--dark-2:#13203a;--r-sm:8px;--r-md:12px;--r-lg:16px;--r-xl:20px;--sp-1:4px;--sp-2:8px;--sp-3:12px;--sp-4:16px;--sp-5:20px;--sp-6:28px;--fs-xs:11px;--fs-sm:12.5px;--fs-md:13.5px;--fs-lg:15px;--fs-xl:21px;--sh:0 1px 2px rgba(16,29,51,.05),0 8px 24px -14px rgba(16,29,51,.18);--sh-lg:0 12px 40px -16px rgba(13,22,38,.28);--font:'IRANSansX','Vazirmatn',Tahoma,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:radial-gradient(1100px 320px at 85% -80px,rgba(18,163,137,.10),transparent),radial-gradient(900px 300px at 10% -60px,rgba(51,84,158,.08),transparent),var(--bg);color:var(--ink);direction:rtl;line-height:1.8;font-size:14.5px;-webkit-font-smoothing:antialiased}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--brand2);outline-offset:2px;border-radius:6px}
#errbar{position:fixed;top:0;right:0;left:0;background:var(--danger);color:#fff;padding:8px 16px;font-size:12px;z-index:300;display:none;direction:rtl}
.topbar{position:sticky;top:0;z-index:60;background:rgba(255,255,255,.92);-webkit-backdrop-filter:saturate(1.4) blur(10px);backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line)}
.topbar-in{max-width:1360px;margin:auto;display:flex;align-items:center;gap:12px;padding:8px 18px;min-height:64px}
.brand{display:flex;align-items:center;gap:10px;color:var(--ink);font-weight:800;font-size:17px;cursor:pointer;white-space:nowrap;line-height:1.4}
.brand .mark{width:36px;height:36px;border-radius:11px;background:linear-gradient(135deg,var(--brand2),var(--brand));display:grid;place-items:center;color:#fff;flex:none}
.brand small{display:block;font-size:10.5px;font-weight:400;color:var(--muted)}
.menubtn{display:none;width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--ink2);font-size:18px;cursor:pointer;place-items:center;flex:none}
#tokchip{display:flex;align-items:center;gap:8px;margin-inline-start:auto}
.tok{display:flex;align-items:center;gap:6px;background:#f1f5f9;border:1px solid var(--line);color:var(--ink);border-radius:99px;padding:5px 13px;font-size:12.5px;cursor:pointer;transition:.15s;white-space:nowrap}
.tok:hover{border-color:var(--brand);background:var(--soft)}
.tok .plus{color:var(--brand);font-weight:800}
main{max-width:1360px;margin:auto;padding:22px 18px 56px}
.app{display:grid;grid-template-columns:272px minmax(0,1fr);gap:24px;align-items:start}
.side{position:sticky;top:76px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:10px;max-height:calc(100vh - 96px);overflow:auto;box-shadow:var(--sh);scrollbar-width:thin}
.sg{font-size:11px;font-weight:700;color:var(--muted);margin:16px 10px 6px}
.side>.sg:first-child{margin-top:6px}
.sitem{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;font-size:13.5px;cursor:pointer;color:var(--ink2);transition:background .15s,color .15s;user-select:none}
.sitem .si,.sfh .si{width:22px;text-align:center;font-size:16px;flex:none;line-height:1}
.sitem:hover{background:#f1f5fa}
.sitem.on{background:var(--soft);color:var(--brand);font-weight:700}
.sitem.sub{padding:6px 10px;font-size:12.5px;color:var(--muted);gap:8px}
.sitem.sub:hover{color:var(--ink)}
.sitem.sub.on{background:var(--soft);color:var(--brand);font-weight:700}
.sitem.sub.go{color:var(--brand);font-weight:700}
.bd{margin-inline-start:auto;font-size:10.5px;background:#eef1f6;border-radius:99px;padding:0 8px;min-width:22px;text-align:center;line-height:19px;color:var(--muted);white-space:nowrap}
.bd.ok{background:var(--osoft);color:var(--ok)}
.bd.warn{background:var(--asoft);color:#a06a12}
.sflow{margin:1px 0}
.sfh{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border:none;background:none;border-radius:10px;font-size:13.5px;color:var(--ink2);cursor:pointer;text-align:start;transition:background .15s,color .15s}
.sfh:hover{background:#f1f5fa}
.sfh .sfn{flex:1;min-width:0}
.sfh .bd{margin-inline-start:0}
.sfh .chev{width:7px;height:7px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(45deg);margin-top:-3px;opacity:.55;transition:transform .2s;flex:none}
.sflow.open>.sfh{background:#f1f5fa;color:var(--ink);font-weight:700}
.sflow.open>.sfh .chev{transform:rotate(225deg);margin-top:3px}
.sflow.cur>.sfh{color:var(--brand);font-weight:700;position:relative}
.sflow.cur>.sfh::before{content:'';position:absolute;inset-inline-start:0;top:9px;bottom:9px;width:3px;border-radius:3px;background:var(--brand)}
.sfp{display:grid;grid-template-rows:0fr;transition:grid-template-rows .22s ease}
.sflow.open>.sfp{grid-template-rows:1fr}
.sfp-in{overflow:hidden;min-height:0;visibility:hidden;transition:visibility .22s;margin-inline-start:21px;padding-inline-start:6px;border-inline-start:2px solid var(--line)}
.sflow.open>.sfp>.sfp-in{visibility:visible;padding-top:3px;padding-bottom:4px}
.view{display:none}.view.on{display:block;animation:fu .35s ease}
@keyframes fu{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.grid{display:grid;gap:16px}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:1100px){.g4{grid-template-columns:1fr 1fr}.g3{grid-template-columns:1fr 1fr}}
@media(max-width:700px){.g2,.g3,.g4{grid-template-columns:1fr}}
.side-ov{display:none}
@media(max-width:980px){
.app{display:block}
body.authed .menubtn{display:grid}
.side{position:fixed;top:0;bottom:0;right:0;width:min(86vw,320px);max-height:none;border-radius:0;border:none;z-index:120;transform:translateX(105%);transition:transform .25s ease;padding:14px 12px;box-shadow:none;visibility:hidden}
body.sideopen .side{transform:none;visibility:visible;box-shadow:-20px 0 50px rgba(13,22,38,.28)}
body.sideopen .side-ov{display:block;position:fixed;inset:0;background:rgba(13,22,38,.45);z-index:115}
.brand small{display:none}
}
@media(max-width:520px){.tok .tl2{display:none}}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:var(--sh)}
.card.tight{padding:14px 16px}
.ct{font-size:15px;font-weight:800;margin-bottom:14px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:6px 13px;border-radius:99px;border:1px solid var(--line);background:#fff;font-size:12.5px;color:var(--ink2);cursor:pointer;transition:.15s;user-select:none}
.chip:hover{border-color:var(--bline)}
.chip.on{background:var(--soft);border-color:var(--brand);color:var(--brand);font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;padding:3px 10px;border-radius:8px;font-weight:600}
.b-ok{background:var(--osoft);color:var(--ok)}.b-warn{background:var(--asoft);color:#a06a12}.b-bad{background:var(--dsoft);color:var(--danger)}.b-info{background:#eef3fd;color:#33549e}.b-brand{background:var(--soft);color:var(--brand)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:#fff;color:var(--ink2);border-radius:10px;padding:9px 18px;font-size:13.5px;cursor:pointer;font-weight:600;transition:.15s;line-height:1.6}
.btn:hover{border-color:var(--brand);color:var(--brand)}
.btn-primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn-primary:hover{background:var(--brand2);border-color:var(--brand2);color:#fff}
.btn-sm{padding:6px 13px;font-size:12.5px}.btn-xs{padding:4px 11px;font-size:12px}.btn-lg{padding:12px 26px;font-size:15px}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.srow{margin-bottom:13px}
.slab{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--ink2);margin-bottom:3px;gap:8px;flex-wrap:wrap}
.slab b{color:var(--brand);font-size:12px}
.tinp{width:140px;padding:4px 6px;border:1px solid var(--line);border-radius:8px;direction:ltr;text-align:center;font-family:inherit;font-size:11px;background:#fff;color:var(--ink)}
input[type=range]{width:100%;direction:ltr;accent-color:var(--brand);height:22px;cursor:pointer}
.inp{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font-family:inherit;font-size:13px;background:#fff;transition:border-color .15s,box-shadow .15s}
.inp:focus,.tinp:focus,.ch-in input:focus,.fch-in input:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--soft)}
.gauge{height:10px;background:#edf1f7;border-radius:99px;overflow:hidden}
.gauge i{display:block;height:100%;border-radius:99px;background:var(--ok);width:0}
.pbar{height:8px;background:#edf1f7;border-radius:99px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--brand);border-radius:99px}
.kv{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:12.8px;flex-wrap:wrap}
.kv:last-child{border:none}.kv span{color:var(--muted)}.kv b{font-weight:600}
.alert{border-radius:12px;padding:11px 14px;font-size:12.6px;border:1px solid;margin-top:8px}
.al-ok{background:var(--osoft);border-color:#bfe5cd;color:#1c6b40}
.al-warn{background:var(--asoft);border-color:#f2ddb2;color:#7c5410}
.al-bad{background:var(--dsoft);border-color:#f2c8c7;color:#96302d}
.seg{display:inline-flex;background:#eef1f6;border-radius:11px;padding:4px;gap:3px;flex-wrap:wrap}
.seg button{border:none;background:none;padding:6px 14px;border-radius:8px;font-size:12.5px;cursor:pointer;color:var(--ink2);font-weight:600}
.seg button.on{background:#fff;color:var(--brand);box-shadow:0 1px 4px rgba(15,27,45,.12)}
.note{font-size:12px;color:var(--muted);line-height:1.9}
.mini{font-size:13px;font-weight:800;margin:20px 0 10px;color:var(--ink2)}
.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px;box-shadow:var(--sh)}
.stat b{font-size:19px;font-weight:800;color:var(--ink);display:block;line-height:1.5}
.stat span{font-size:12px;color:var(--muted)}
.steps{display:flex;margin:16px 0 20px;padding:14px 8px 12px;overflow-x:auto;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh);scrollbar-width:thin}
.st{flex:1 0 82px;position:relative;text-align:center;padding:0 4px;font-size:11px;color:var(--muted);background:none;border:none}
.st:not(:last-child)::after{content:'';position:absolute;top:13px;right:50%;width:100%;height:2px;background:var(--line);z-index:0}
.st.done:not(:last-child)::after{background:var(--ok)}
.st b{display:block;font-size:11.5px;font-weight:600;color:var(--muted);line-height:1.5}
.st .stn{position:relative;z-index:1;display:grid;place-items:center;width:26px;height:26px;margin:0 auto 6px;border-radius:50%;background:#eef1f6;color:var(--muted);font-size:11.5px;font-weight:700;box-shadow:0 0 0 4px #fff}
.st.cur .stn{background:var(--brand);color:#fff}
.st.cur b{color:var(--brand);font-weight:800}
.st.done .stn{background:var(--ok);color:#fff}
.st.done b{color:var(--ink2)}
.st[data-jump]{cursor:pointer}
.st[data-jump]:hover b{color:var(--brand)}
@media(max-width:700px){.st:not(.cur){flex-basis:34px}.st:not(.cur) b{display:none}.st.cur{flex-basis:120px}}
.wtop{display:flex;align-items:center;gap:10px 12px;margin-bottom:2px;flex-wrap:wrap}
.wtop>div:first-child{flex:1;min-width:200px}
.wtop h2{font-size:21px;font-weight:800;line-height:1.5}
.wtop p{font-size:12.5px;color:var(--muted)}
.wprog{background:var(--soft);color:var(--brand);border-radius:99px;padding:4px 13px;font-size:12px;font-weight:700;white-space:nowrap}
.wnav{display:flex;gap:10px;align-items:center;margin-top:22px;flex-wrap:wrap;position:sticky;bottom:10px;z-index:20;background:rgba(255,255,255,.95);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:14px;padding:10px 14px;padding-inline-end:84px;box-shadow:0 8px 24px -10px rgba(16,29,51,.22)}
.wnav .note{flex:1;text-align:center;min-width:140px}
.wnav .btn-primary{margin-inline-start:auto}
.switch{position:relative;display:inline-block;width:40px;height:22px;flex:none;vertical-align:middle}
.switch input{position:absolute;opacity:0;width:0;height:0}
.switch .tr{position:absolute;inset:0;background:#cbd5e1;border-radius:99px;transition:.2s;cursor:pointer}
.switch .tr::before{content:'';position:absolute;top:3px;right:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.switch input:checked+.tr{background:var(--brand)}
.switch input:checked+.tr::before{transform:translateX(-18px)}
.switch input:focus-visible+.tr{outline:2px solid var(--brand2);outline-offset:2px}
.cmpbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--soft);border:1px solid var(--bline);border-radius:12px;padding:10px 14px;font-size:13px;margin-bottom:14px}
.cmpbar .note{flex:1;min-width:120px}
.reqbar{background:#fff;border:1px solid var(--line);border-radius:12px;margin:0 0 14px;overflow:hidden}
.reqbar-h{display:flex;align-items:center;gap:10px;width:100%;padding:9px 14px;border:none;background:none;cursor:pointer;font-size:13px;font-weight:700;color:var(--ink2);text-align:start;flex-wrap:wrap}
.reqbar-h:hover{background:#f8fafc}
.reqbar-h .chev{width:7px;height:7px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(45deg);margin-top:-3px;opacity:.55;transition:transform .2s;flex:none}
.reqbar.open .reqbar-h .chev{transform:rotate(225deg);margin-top:3px}
.reqbar-h .sp{flex:1}
.reqbar-b{padding:2px 14px 14px;border-top:1px solid var(--line)}
.ph{position:relative;overflow:hidden;height:100%;background:linear-gradient(135deg,#3f5e79,#2c4258)}
.ph .fb{position:absolute;inset:0;display:grid;place-items:center;color:rgba(255,255,255,.85);font-size:24px}
.ph img{position:relative;width:100%;height:100%;object-fit:cover;display:block;z-index:1}
.lcard{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;transition:.15s}
.lcard:hover{box-shadow:0 10px 30px -12px rgba(15,27,45,.18)}
.lcard.sel{border-color:var(--brand);box-shadow:0 0 0 2px var(--soft)}
.lart{position:relative;height:150px;overflow:hidden;background:#2c4258}
.lart .match{position:absolute;top:8px;right:8px;background:rgba(13,22,38,.72);color:#fff;font-size:10.5px;padding:3px 10px;border-radius:99px;z-index:3}
.lbody{padding:12px 14px;display:flex;flex-direction:column;gap:7px;flex:1}
.lbody h4{font-size:13.5px;font-weight:800}
.adr{font-size:11.5px;color:var(--muted)}
.ltags{display:flex;flex-wrap:wrap;gap:4px}
.ltags span{font-size:10.5px;background:#f1f5fa;color:var(--ink2);padding:2px 8px;border-radius:6px}
.lfoot{display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:9px;border-top:1px dashed var(--line);gap:8px;flex-wrap:wrap}
.lfoot .pr b{font-size:13px;color:var(--brand)}
.lfoot .pr span{font-size:10.5px;color:var(--muted);display:block}
.tblwrap{overflow-x:auto;background:#fff;border:1px solid var(--line);border-radius:12px}
.tbl{width:100%;border-collapse:collapse;font-size:12.4px;min-width:480px}
.tbl th{text-align:right;padding:9px 12px;color:var(--muted);font-size:11.5px;border-bottom:1px solid var(--line);background:#f8fafc;font-weight:600}
.tbl td{padding:8px 12px;border-bottom:1px dashed var(--line);text-align:right}
.tbl tr:last-child td{border-bottom:none}
#v-auth{max-width:420px;margin:40px auto}
.pack{border:1px solid var(--line);border-radius:16px;padding:22px;background:#fff;text-align:center;position:relative}
.pack.best{border-color:var(--brand)}
.pack .pk{font-size:15px;font-weight:800}
.pack .pt{font-size:18px;font-weight:800;color:var(--brand);margin:6px 0}
.pack ul{list-style:none;text-align:right;font-size:12.5px;color:var(--ink2)}
.pack ul li{padding:3px 0}
.badge-best{position:absolute;top:-11px;right:50%;transform:translateX(50%);background:var(--brand);color:#fff;font-size:10.5px;padding:3px 12px;border-radius:99px}
.tl{position:relative;padding-right:24px;margin-top:8px}
.tl::before{content:'';position:absolute;right:8px;top:8px;bottom:8px;width:2px;background:var(--line)}
.tli{position:relative;padding:6px 0;font-size:13px}
.tli .dot{position:absolute;right:-24px;top:10px;width:18px;height:18px;border-radius:50%;background:#fff;border:2px solid #c6d2e0;display:grid;place-items:center;font-size:9px;color:transparent}
.tli.done .dot{background:var(--ok);border-color:var(--ok);color:#fff}
.tli.act .dot{border-color:var(--accent);color:var(--accent)}
.tli small{display:block;color:var(--muted);font-size:11.5px}
.chart{width:100%;height:auto}
.chart .cg{stroke:#eef2f8;stroke-width:1}
.chart .cl,.chart .xl{fill:#93a0b4;font-size:9.5px;font-family:Vazirmatn}
.chart .cline{fill:none;stroke:var(--brand);stroke-width:2.4;stroke-linecap:round}
.chart .carea{fill:rgba(18,163,137,.12)}
.chart .cp{fill:#fff;stroke:var(--brand);stroke-width:2}
.chart .cbv{font-size:10px;font-family:Vazirmatn;font-weight:700}
#modal-root{position:fixed;inset:0;background:rgba(13,22,38,.55);z-index:110;display:none;align-items:center;justify-content:center;padding:20px}
#modal-root.on{display:flex}
.modal{background:#fff;border-radius:18px;max-width:640px;width:100%;max-height:88vh;overflow:auto;padding:24px;animation:fu .3s}
.modal h3{font-size:16.5px;margin-bottom:6px}
#toast-root{position:fixed;bottom:20px;right:50%;transform:translateX(50%);z-index:130;display:flex;flex-direction:column;gap:8px;align-items:center;max-width:92vw}
.toast{background:var(--dark);color:#fff;padding:10px 20px;border-radius:12px;font-size:13px;animation:fu .3s}
.codebox{background:var(--dark);color:#5fd6bf;border-radius:12px;padding:12px;text-align:center;font-size:24px;font-weight:800;letter-spacing:8px;direction:ltr;margin:10px 0}
.ba{position:relative;border-radius:14px;overflow:hidden;height:220px;user-select:none;margin:8px 0}
.ba .layer{position:absolute;inset:0}
.ba .cap{position:absolute;bottom:8px;right:10px;background:rgba(13,22,38,.7);color:#fff;font-size:10.5px;padding:3px 10px;border-radius:99px;z-index:4}
.ba .after{clip-path:inset(0 0 0 45%)}
.ba .handle{position:absolute;top:0;bottom:0;width:3px;background:#fff;left:55%;z-index:5}
.ba input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:ew-resize;z-index:6}
.mk{position:absolute;width:26px;height:26px;border-radius:50%;background:var(--danger);border:3px solid #fff;display:grid;place-items:center;color:#fff;font-size:12px;font-weight:800;cursor:help;z-index:4}
.hero{background:radial-gradient(800px 340px at 85% -10%,rgba(18,163,137,.35),transparent),var(--dark);border-radius:20px;padding:30px 32px;color:#fff;position:relative;overflow:hidden}

<script>
window.onerror=function(m,s,l){var e=document.getElementById('errbar');if(e){e.style.display='block';e.textContent='خطای اسکریپت: '+m+' — خط '+l;}return false;};

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
/* ═══ ۱) ابزار ═══ */
function $(s){return document.querySelector(s)}
function $$(s){return Array.prototype.slice.call(document.querySelectorAll(s))}
function fa(n,d){if(d===undefined)d=0;n=Number(n);if(isNaN(n))n=0;return n.toLocaleString('fa-IR',{maximumFractionDigits:d})}
function rial(v){return fa(v,0)+' ریال'}
function dt(t){try{return new Date(t).toLocaleDateString('fa-IR',{month:'long',day:'numeric'})}catch(e){return ''}}
function esc(t){return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;')}
function qesc(t){return esc(t).replace(/"/g,'&quot;')}
var PD={'۰':'0','۱':'1','۲':'2','۳':'3','۴':'4','۵':'5','۶':'6','۷':'7','۸':'8','۹':'9'};
function pd(s){return String(s).replace(/[۰-۹]/g,function(c){return PD[c]})}
function ph(seed,w,h,fb){return '<div class="ph"><div class="fb">'+fb+'</div><img src="https://picsum.photos/seed/'+seed+'/'+w+'/'+h+'" alt="" loading="lazy" onerror="this.remove()"></div>'}
function starsN(n){var s='',i;for(i=0;i<5;i++){s+=(i<n?'★':'☆')}return '<span class="stars2">'+s+'</span>'}
function toast(msg){var t=document.createElement('div');t.className='toast';t.textContent=msg;$('#toast-root').appendChild(t);setTimeout(function(){if(t.parentNode)t.parentNode.removeChild(t)},3400)}
function openModal(html,cb){var r=$('#modal-root');r.innerHTML='<div class="modal">'+html+'</div>';r.classList.add('on');r.onclick=function(e){if(e.target===r)closeModal()};if(cb)cb()}
function closeModal(){var r=$('#modal-root');r.classList.remove('on');r.innerHTML=''}

/* ═══ ۲) وضعیت ═══ */
var LSKEY='khanyar_v15';
var S=null;
try{S=JSON.parse(localStorage.getItem(LSKEY))}catch(e){S=null}
if(!S||typeof S!=='object'){S={}}
if(S.auth===undefined){S.auth=null}
if(S.tokens===undefined){S.tokens=0}
if(S.wallet===undefined){S.wallet=0}
if(S.welcomed===undefined){S.welcomed=false}
if(S.pending===undefined){S.pending=null}
if(!S.prof){S.prof={work:null,school:null,workLL:null,schoolLL:null}}
if(!S.wlog){S.wlog=[]}
if(!S.log){S.log=[]}
if(!S.reqs){S.reqs=[]}
if(!S.flow){S.flow={}}
if(!S.contracts){S.contracts=[]}
if(!S.reviews){S.reviews=[]}
if(!S.nprj){S.nprj=[]}
if(!S.ui){S.ui={tab:'b',dcat:'rent',yh:24,crng:12,nrng:12}}
function save(){try{localStorage.setItem(LSKEY,JSON.stringify(S))}catch(e){}}

/* ═══ ۳) توکن و کیف پول ═══ */
var COSTS={detail:10,visit:20,valuation:40,legal:100,contract:150,escrow:150,bid:20,stay:30};
var COSTL={detail:'جزئیات راستی‌آزمایی‌شدهٔ آگهی',visit:'هماهنگی بازدید',valuation:'تخمین ارزش',legal:'گزارش حقوقی',contract:'ثبت اجاره‌نامهٔ دیجیتال',escrow:'مبایعهٔ امانی',bid:'ارسال پیشنهاد',stay:'رزرو امانی اقامتگاه'};
function renderTok(){
  var el=$('#tokchip');if(!el)return;
  if(S.auth){
    el.innerHTML='<button class="tok" data-act="wallet" title="کیف پول"><span>💳</span><b>'+rial(S.wallet||0)+'</b></button><button class="tok" data-view="sub" title="شارژ توکن"><span>🪙</span><b>'+fa(S.tokens,0)+'</b><span class="tl2">توکن</span><span class="plus">＋</span></button>';
  }else{
    el.innerHTML='<button class="btn btn-primary btn-sm" data-view="auth">ورود / ثبت‌نام</button>';
  }
  document.body.classList.toggle('authed',!!S.auth);
  var fb=$('#fcbfab');if(fb&&fb.classList){fb.className=S.auth?'on':''}
}
function spend(key,cat,desc){
  var c=COSTS[key]||0;
  if(S.tokens<c){
    openModal('<h3>🪙 توکن کافی نیست</h3><p class="note">این خدمت '+fa(c,0)+' توکن لازم دارد؛ موجودی شما '+fa(S.tokens,0)+' توکن است.</p><div style="display:flex;gap:8px;margin-top:14px"><button class="btn btn-primary" data-view="sub">شارژ توکن</button><button class="btn" data-act="closeModal">بستن</button></div>');
    return false;
  }
  S.tokens-=c;S.log.unshift({t:Date.now(),d:desc,c:-c,cat:cat});save();renderTok();
  toast('−'+fa(c,0)+' 🪙 — '+desc);return true;
}
function earn(n,cat,desc){S.tokens+=n;S.log.unshift({t:Date.now(),d:desc,c:n,cat:cat});save();renderTok();toast('+'+fa(n,0)+' 🪙 — '+desc)}
function walletIn(a,d){S.wallet=(S.wallet||0)+a;S.wlog.unshift({t:Date.now(),d:d,a:a});save();renderTok();toast('💳 '+rial(a)+' به کیف پول واریز شد')}
function addReq(cat,type,title,status,detail){
  var id='R'+Date.now()+Math.floor(Math.random()*999);
  S.reqs.unshift({id:id,cat:cat,type:type,title:title,status:status||'در انتظار',t:Date.now(),detail:detail||''});
  save();return id;
}
function setReq(id,st){var i;for(i=0;i<S.reqs.length;i++){if(S.reqs[i].id===id){S.reqs[i].status=st;save();return}}}
function stB(s){var m={'در انتظار':'b-warn','تأیید شد':'b-ok','در حال انجام':'b-info','کامل شد':'b-ok','لغو شد':'b-bad'};return '<span class="badge '+(m[s]||'b-info')+'">'+s+'</span>'}

/* ═══ ۴) نمودار ═══ */
function spark(host,data,labels,fmt){

function guardOK(m){
  var d=wd(m),D=d.data;
  if(m==='rent'){
    if(d.step===3&&!D.hood)return 'ابتدا یک محله انتخاب کنید.';
    if(d.step===5&&!D.listing)return 'ابتدا یک ملک انتخاب کنید.';
    if(d.step===6&&!D.visitDay)return 'ابتدا درخواست بازدید را ثبت کنید.';
    if(d.step===7&&!D.signed)return 'ابتدا قرارداد را امضا کنید.';
  }
  if(m==='buy'){
    if(d.step===2&&!D.hood)return 'ابتدا یک محله انتخاب کنید.';
    if(d.step===5&&!D.blist)return 'ابتدا یک ملک انتخاب کنید.';
    if(d.step===6&&!D.legal)return 'ابتدا گزارش حقوقی را دریافت کنید.';
    if(d.step===7){
      if(!D.pay||!D.pay.ok)return 'ابتدا توافق پرداخت طرفین را نهایی کنید.';
      if(!D.escrow)return 'همهٔ مراحل آزادسازی امانی را تأیید کنید.';
    }
    if(d.step===8&&!D.utils)return 'انتقال انشعابات را کامل کنید.';
  }
  if(m==='invb'&&d.step===3&&!D.bought)return 'ابتدا پرداخت را نهایی کنید.';
  if(m==='invr'&&d.step===3&&!D.fund)return 'ابتدا خرید توکن را نهایی کنید.';
  if(m==='mkt'){
    if(d.step===2&&!D.role)return 'ابتدا نقش خود را انتخاب کنید.';
    if(d.step===3){
      if(D.role==='con'&&!D.bid)return 'ابتدا پیشنهاد خود را ثبت کنید.';
      if(D.role==='emp'&&!D.chosen)return 'ابتدا یک پیمانکار را تأیید کنید.';
    }
  }
  if(m==='build'){
    if(d.step===1&&(!D.orders||!D.orders.length))return 'حداقل یک سفارش تأمین ثبت کنید.';
    if(d.step===2){
      if(!D.ph){D.ph=[100,80,40,0,0]}
      var tot=0,w=[12,34,22,18,14],q;
      for(q=0;q<5;q++){tot+=w[q]*D.ph[q]}
      tot=tot/100;
      if(tot<100)return 'پیشرفت پروژه را تا ۱۰۰٪ کامل کنید.';
    }
  }
  if(m==='stay'){
    if(d.step===2&&(!D.city||!D.ppl))return 'نام شهر و تعداد مسافران را وارد کنید.';
    if(d.step===3&&!D.stay)return 'ابتدا یک اقامتگاه انتخاب کنید.';
    if(d.step===4&&!D.code)return 'ابتدا رزرو امانی را ثبت کنید.';
  }
  return null;
}

  if(x.ppm<P.ppm[0]||x.ppm>P.ppm[1])return false;
  if(x.floor<P.floorR[0]||x.floor>P.floorR[1])return false;
  if(P.beds>0&&x.beds<P.beds)return false;
  if(P.elev==='yes'&&!x.elev)return false;
  if(P.park==='yes'&&!x.park)return false;
  if(P.balc==='yes'&&!x.balc)return false;
  return true;
}
function bScore(x,D){
  var s=50;
  if(x.age<=3)s+=10;else if(x.age<=10)s+=5;
  if(D.PR.beds>0&&x.beds>D.PR.beds)s+=3;
  if(x.elev)s+=3;if(x.park)s+=3;if(x.balc)s+=2;
  s+=Math.round(hoodScore(findH(x.hood),D.P)/12);
  return Math.min(98,Math.round(s));
}
function lscore(x,D){
  var s=50;
  if(x.rent<=D.B.rentB)s+=18;else s-=Math.min(15,(x.rent-D.B.rentB)/5000000);
  if(x.age<=D.P.maxAge)s+=8;else s-=6;
  if(x.m2>=D.P.minM2)s+=8;else s-=5;
  if(D.P.beds>0&&x.beds>=D.P.beds)s+=4;
  if(D.P.floor==='low'&&x.floor<=3)s+=5;
  if(D.P.floor==='high'&&x.floor>=4)s+=5;
  if(D.P.elev&&x.elev)s+=3;
  if(D.P.park&&x.park)s+=3;
  s+=Math.round(hoodScore(findH(x.hood),D.P)/15);
  return Math.max(25,Math.min(98,Math.round(s)));
}

function ceStart(f){CE.f=f;CE.i=0;CE.li=0;ceStep()}
function ceJump(id){
  if(!CE.f){return}
  var sc=SCRIPTS[CE.f],j;
  for(j=0;j<sc.length;j++){if(sc[j].id===id){CE.i=j;CE.li=0;ceStep();return}}
}
function ceStep(){
  if(!CE.f){return}
  var sc=SCRIPTS[CE.f];
  if(CE.i>=sc.length){ceEnd();return}
  var st=sc[CE.i],D=wd(CE.f).data;
  if(st.pre&&st.pre(D)===false){CE.i++;ceStep();return}
  if(st.loop){botC(st.loop[CE.li].t,CHIP5());return}
  var q=st.q;
  if(typeof st.q==='function'){q=st.q(D)}
  if(st.cards){q+='<div class="chcards">'+st.cards(D)+'</div>'}
  botC(q,st.chips?st.chips(D):null);
}
function CHIP5(){return [['۱','1'],['۲','2'],['۳','3'],['۴','4'],['۵','5']]}
function ceEnd(){
  var f=CE.f;CE.f=null;
  var backBtn=null;
  try{if(f&&MODBY[f]){backBtn=['ادامه در فلو (قدم‌به‌قدم)','F:step:'+f]}}catch(e){}
  var chips=[['منوی اصلی','!menu'],['داشبورد','F:dashx']];

  botC('🎉 <b>فلوی '+MODBY[f].t+' کامل شد.</b> در داشبورد ثبت شد.',chips);
}
function ceVal(v){
  if(v==='!menu'){ceStart('gate');CE.i=3;ceStep();return}
  if(v==='!help'){
    botC('فرمان‌ها: «ادامه»، «محله‌ها»، «مقایسه»، «امضا»، «فسخ»، «چند توکن دارم»، «کیف پول»، «نقشه»، «منو».',[['منوی اصلی','!menu']]);
    return;
  }
  if(v.indexOf('F:')===0){
    var t=v.slice(2);
    if(t==='dashx'){go('dash')}
    else if(t==='sub'||t==='wallet'){DASHT='wallet';go('dash')}
    else if(t.indexOf('step:')===0){var sm=t.slice(5);if(MODBY[sm]){save();go(MODBY[sm].v)}else{ceStart(t)}}
    else{ceStart(t)}
    return;
  }
  if(v==='!wl'){ACT.wallet();return}
  if(!CE.f){botC('از منوی اصلی شروع کنید:',[['منوی اصلی','!menu']]);return}
  var sc=SCRIPTS[CE.f],st=sc[CE.i],D=wd(CE.f).data;
  if(v.charAt(0)==='!'&&st.acts&&st.acts[v.slice(1)]){st.acts[v.slice(1)](D);return}
  if(st.loop){
    if(!D.P){D.P={}}
    D.P[st.loop[CE.li].k]=Math.max(1,Math.min(5,parseInt(pd(v),10)||3));
    CE.li++;
    if(CE.li<st.loop.length){botC(st.loop[CE.li].t,CHIP5())}
    else{CE.i++;CE.li=0;save();renderCurrent();ceStep()}
    return;
  }
  var done=null;
  if(st.set){done=st.set(D,v)}
  else if(st.key){D[st.key]=v}
  if(done==='ERR'){botC('⚠️ ورودی نامعتبر — دوباره تلاش کنید یا از دکمه‌ها انتخاب کنید.');return}
  if(st.until){
    if(done==='DONE'){CE.i++;save();renderCurrent();ceStep()}
    else{save();botC('✓ اضافه شد. مورد دیگر؟ (یا «تمام»)',[['تمام','تمام']])}
    return;
  }
  CE.i++;CE.li=0;save();renderCurrent();ceStep();
}
function ceSend(t){
  t=(t||'').replace(/^\s+|\s+$/g,'');
  if(!t){return}
  var st=CE.f?SCRIPTS[CE.f][CE.i]:null;
  if(st&&(st.kind==='text'||st.kind==='num')){usrC(t);ceVal(t,t);return}
  usrC(t);

  },2500);
  renderCurrent();

}

  S.contracts.push({code:D.code,kind:'rent',title:'اجاره‌نامهٔ '+x.t,t:Date.now(),req:rid,detail:true});

var MAPS={};

function mkMap(elId,center,zoom){

  }
  if(MAPS[elId]){try{MAPS[elId].remove()}catch(e){}}
  var m=L.map(elId).setView(center,zoom);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18,attribution:'© OpenStreetMap'}).addTo(m);
  MAPS[elId]=m;
  return m;
}

document.addEventListener('keydown',function(e){
  var t=e.target;
  if(e.key==='Escape'){document.body.classList.remove('sideopen');return}
  if((e.key==='Enter'||e.key===' ')&&t&&t.getAttribute&&t.getAttribute('role')==='button'){e.preventDefault();t.click()}
});
document.addEventListener('click',function(e){
  var t=e.target;
  if(!t||!t.closest)return;
  var el;
  if(document.body.classList.contains('sideopen')&&t.closest('#side')&&!t.closest('.sfh')){document.body.classList.remove('sideopen')}
  el=t.closest('[data-cv]');
  if(el){
    var lab=(el.textContent||'').replace(/^\s+|\s+$/g,'');
    usrC(lab);
    ceVal(el.getAttribute('data-cv'));
    return;
  }
  el=t.closest('[data-cf]');
  if(el){
    usrC((el.textContent||'').replace(/^\s+|\s+$/g,''));
    ceStart(el.getAttribute('data-cf'));
    return;
  }
  el=t.closest('[data-cba]');
  if(el){
    var f2=CBACT[el.getAttribute('data-cba')];
    if(f2){f2(el)}
    return;
  }
  el=t.closest('[data-w]');
  if(el){
    wizardNav(el.getAttribute('data-m'),el.getAttribute('data-w'));
    return;
  }
  el=t.closest('[data-jump]');
  if(el){
    jumpTo(el.getAttribute('data-m'),+el.getAttribute('data-jump'));
    return;
  }
  el=t.closest('[data-act]');
  if(el){
    var f=ACT[el.getAttribute('data-act')];
    if(f){f(el,e)}
    return;
  }
  el=t.closest('[data-view]');
  if(el){go(el.getAttribute('data-view'))}
});
document.addEventListener('input',function(e){
  var t=e.target;
  if(!t||!t.hasAttribute)return;
  if(t.hasAttribute('data-paytxt')){
    var dg=pd(t.value).replace(/[^0-9]/g,'').slice(0,14);
    t.value=dg;
    var amt=+dg||0;
    var rate=PAYM.ctx?PAYM.ctx.rate:1;
    var unit=PAYM.ctx?PAYM.ctx.unit:'';
    var fee=Math.round(amt*0.005);
    var eA=document.getElementById('pay-amt');if(eA){eA.textContent=rial(amt)}
    var eU=document.getElementById('pay-units');if(eU){eU.textContent=fa(Math.floor(amt/rate),0)+' '+unit}
    var eF=document.getElementById('pay-fee');if(eF){eF.textContent=rial(fee)}
    var eT=document.getElementById('pay-total');if(eT){eT.textContent=rial(amt+fee)}
    if(PAYM.mode==='invb'){wd('invb').data.payAmt=dg;save()}
    else if(PAYM.ctx){PAYM.amt=dg}
    return;
  }
  if(t.hasAttribute('data-ep')){
    var pi=+t.getAttribute('data-ep');
    var DP=wd('buy').data;
    defPay(DP);
    var v=pd(t.value).replace(/[^0-9]/g,'').slice(0,3);
    t.value=v;
    DP.pay.pcts[pi]=+v||0;
    var s=0;
    DP.pay.pcts.forEach(function(x){s+=x});
    var eS=document.getElementById('paysum');
    if(eS){eS.textContent='جمع: '+fa(s,0);eS.style.color=(Math.abs(s-100)<0.01?'#2e9e5b':'#d9534f')}
    save();
    return;
  }
  if(t.hasAttribute('data-dt')){
    var k=t.getAttribute('data-dt'),side=+t.getAttribute('data-side');
    var DB=wd('buy').data;
    defPR(DB);
    var tgt=(k==='floorR')?DB.PR.floorR:DB.PR[k];
    var mn=+t.getAttribute('data-min'),mx=+t.getAttribute('data-max');
    var v2=pd(t.value).replace(/[^0-9]/g,'');
    t.value=v2;
    if(v2!==''){
      var n=Math.max(mn,Math.min(mx,+v2));
      tgt[side]=n;save();drLabel(k,tgt);
      var row=t.parentNode;
      if(row){
        var rg=row.querySelector('[data-dr="'+k+'"][data-side="'+side+'"]');
        if(rg){rg.value=n}
      }
    }
    return;
  }
  if(t.hasAttribute('data-tk')){
    var k2=t.getAttribute('data-tk');
    var row2=t.parentNode;
    var rg2=row2?row2.querySelector('[data-rk="'+k2+'"]'):null;
    var v3=pd(t.value).replace(/[^0-9]/g,'');
    if(rg2&&v3!==''){
      var n2=+v3;
      if(!isNaN(n2)){
        var mn2=+rg2.getAttribute('data-min');
        var mx2=+rg2.getAttribute('data-max');
        n2=Math.max(mn2,Math.min(mx2,n2));
        rg2.value=n2;
        var ev;
        try{ev=new Event('input');rg2.dispatchEvent(ev)}catch(e2){}
      }
    }
    return;
  }
  if(t.hasAttribute('data-rk')){
    var k3=t.getAttribute('data-rk');
    var row3=t.parentNode;
    var tx=row3?row3.querySelector('[data-tk="'+k3+'"]'):null;
    if(tx){tx.value=t.value}
    var lb=row3?row3.querySelector('[data-lbl="'+k3+'"]'):null;
    if(!lb){
      lb=row3?row3.querySelector('b[id="rv-'+k3+'"]'):null;
    }
    if(!lb){
      var all=row3?row3.querySelectorAll('b'):[];
      var j;
      for(j=0;j<all.length;j++){
        if(all[j].id===('rv-'+k3)){lb=all[j];break}
      }
    }
    if(lb&&RNGF[k3]){lb.textContent=RNGF[k3](+t.value)}
  }
});
