function validNationalId(id){
  id=String(id||'').replace(/\D/g,'');
  if(id.length!==10||/^(\d)\1{9}$/.test(id))return false;
  var s=0,i,d;
  for(i=0;i<9;i++){d=+id.charAt(i);s+=d*(10-i)}
  var r=s%11,chk=+id.charAt(9);
  return chk===(r<2?r:11-r);
}
function validPostalCode(code){code=String(code||'').replace(/\D/g,'');return code.length===10&&code.charAt(0)!=='0'&&!/^(\d)\1{9}$/.test(code)}
function lookupIdentity(id,role){
  var D=wd(conKind()).data,c=conInit(D,conKind());
  var v=(document.getElementById(role==='me'?'cl-id':'co-id')||{}).value||'';
  v=String(v).replace(/\D/g,'');
  if(!validNationalId(v)){lookupStatus('lk-id-'+(role==='me'?'me':'owner'),'err','کد ملی معتبر نیست؛ ۱۰ رقم و رقم کنترلی را بررسی کنید.');return false}
  c.parties[role==='me'?'lessee':'lessor'].id=v;
  var cfg=lkConfig();
  if(!cfg.identityEndpoint){
    c.verify[role]='format';
    save();
    lookupStatus('lk-id-'+(role==='me'?'me':'owner'),'warn','کد ملی از نظر قالب معتبر است. تأیید رسمی هویت در این نسخه انجام نمی‌شود؛ نام حساب شما حفظ شد.');
    return true;
  }
  lookupStatus('lk-id-'+(role==='me'?'me':'owner'),'load','در حال استعلام هویت...');
  var ctrl=window.AbortController?new AbortController():null;
  var timer=ctrl?setTimeout(function(){ctrl.abort()},12000):null;
  fetch(cfg.identityEndpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({nationalId:v}),signal:ctrl?ctrl.signal:undefined})
    .then(function(r){return r.json()})
    .then(function(j){
      if(timer)clearTimeout(timer);
      if(!j||j.ok===false||!j.firstName&&!j.lastName){lookupStatus('lk-id-'+(role==='me'?'me':'owner'),'err','هویت پیدا نشد؛ کد ملی را بررسی کنید یا بعداً دوباره تلاش کنید.');return}
      var nm=[j.firstName||'',j.lastName||''].join(' ').trim();
      if(nm){
        if(role==='me'){c.parties.lessee.name=nm;var e=document.getElementById('cl-name');if(e)e.value=nm}
        else{c.parties.lessor.name=nm;var e2=document.getElementById('co-name');if(e2)e2.value=nm}
      }
      c.verify[role]='official';
      save();lookupStatus('lk-id-'+(role==='me'?'me':'owner'),'ok','هویت تأیید شد و اطلاعات موجود تکمیل شد.');
    })
    .catch(function(){if(timer)clearTimeout(timer);lookupStatus('lk-id-'+(role==='me'?'me':'owner'),'err','سرویس هویت در دسترس نیست؛ دوباره تلاش کنید یا اطلاعات را دستی وارد کنید.')});
  return true;
}
function lookupPostal(){
  var D=wd(conKind()).data,c=conInit(D,conKind());
  var code=((document.getElementById('cp-postal')||{}).value||'').replace(/\D/g,'');
  if(!validPostalCode(code)){lookupStatus('lk-postal','err','کد پستی باید ۱۰ رقم باشد و با صفر شروع نشود.');return}
  c.prop.postal=code;
  lookupStatus('lk-postal','load','در حال استعلام نشانی...');
  var cfg=lkConfig();
  function done(addr,approx){
    if(!addr){lookupStatus('lk-postal','err','نشانی‌ای برای این کد پیدا نشد؛ می‌توانید نشانی را دستی وارد کنید.');return}
    c.prop.addr=addr;
    var a=document.getElementById('cp-addr');if(a)a.value=addr;
    save();
    lookupStatus('lk-postal','ok',(approx?'نشانی تقریبی':'نشانی')+' پر شد؛ لطفاً پلاک و جزئیات را بررسی کنید.');
  }
  if(cfg.postalEndpoint){
    fetch(cfg.postalEndpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({postalCode:code})})
      .then(function(r){return r.json()})
      .then(function(j){if(!j||j.ok===false||!j.address){lookupStatus('lk-postal','err','کد پستی پیدا نشد؛ آن را بررسی کنید.');return}done(j.address,!!j.approximate)})
      .catch(function(){lookupStatus('lk-postal','err','سرویس کد پستی در دسترس نیست؛ دوباره تلاش کنید.')});
    return;
  }
  fetch('https://photon.komoot.io/api/?q='+encodeURIComponent(code)+'&limit=3')
    .then(function(r){return r.json()})
    .then(function(j){
      var f=(j&&j.features||[]).filter(function(x){var nm=x.properties?String(x.properties.name||'').replace(/\D/g,''):'';return x.properties&&(x.properties.osm_value==='postcode'&&nm===code)})[0];
      if(f){
        var p=f.properties,parts=[p.district,p.city,p.county,p.state].filter(function(x){return x});
        done(parts.join('، '),true);return;
      }
      return fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&addressdetails=1&countrycodes=ir&postalcode='+code+'&limit=1')
        .then(function(r){return r.json()})
        .then(function(a){if(a&&a[0])done(a[0].display_name,false);else done(null,false)});
    })
    .catch(function(){lookupStatus('lk-postal','err','سرویس نشانی در دسترس نیست؛ دوباره تلاش کنید یا نشانی را دستی وارد کنید.')});
}

function mkMap(elId,center,zoom){
  var el=document.getElementById(elId);
  if(!el)return null;
  if(!window.L){mapFallback(el,'کتابخانهٔ نقشه بارگذاری نشد.',elId!=='lfm2');return null}
  if(MAPS[elId]){try{MAPS[elId].remove()}catch(e){}delete MAPS[elId]}
  el.innerHTML='';el.style.position='relative';
  var m=L.map(el,{zoomControl:true,attributionControl:true,scrollWheelZoom:true}).setView(center,zoom);
  try{m.attributionControl.setPrefix(false)}catch(e){}
  var loaded=0,failed=0,notified=false,pi=0,tl=null;
  function warn(){
    if(notified||!document.body.contains(el))return;
    notified=true;
    var n=document.createElement('div');
    n.className='mapnote';
    n.innerHTML='<span>برخی قطعات نقشه بارگیری نشد.</span>'+(elId!=='lfm2'?'<button class="btn btn-xs" data-act="mapRetry">تلاش دوباره</button>':'')+'<span class="note">نشانگرها و انتخاب موقعیت فعال‌اند.</span>';
    el.appendChild(n);
  }
  function addTiles(){
    if(tl){try{m.removeLayer(tl)}catch(e){}}
    var p=MAP_TILE.providers[pi];
    tl=L.tileLayer(p.u,{maxZoom:MAP_TILE.maxZoom,attribution:p.a,crossOrigin:true}).addTo(m);
    tl.on('tileload',function(){loaded++});
    tl.on('tileerror',function(){
      failed++;
      if(loaded===0&&failed>=4&&pi<MAP_TILE.providers.length-1){pi++;failed=0;addTiles();return}
      if(failed>=4&&loaded===0)warn();
    });
  }
  addTiles();
  setTimeout(function(){if(loaded===0&&failed>0)warn()},9000);
  MAPS[elId]=m;
  setTimeout(function(){try{m.invalidateSize()}catch(e){}},80);
  setTimeout(function(){try{m.invalidateSize()}catch(e){}},450);
  return m;
}

function activityRows(n){
  var rows=[];
  S.log.forEach(function(l){rows.push({t:l.t,d:l.d,amt:(l.c<0?'−':'+')+fa(Math.abs(l.c),0)+' توکن',cls:l.c<0?'out':'in'})});
  S.wlog.forEach(function(w){rows.push({t:w.t,d:w.d,amt:rial(Math.abs(w.a)),cls:w.a<0?'out':'in'})});
  rows.sort(function(a,b){return b.t-a.t});
  return rows.slice(0,n);
}
function activityHTML(n){
  var rows=activityRows(n);
  if(!rows.length)return '<div class="empty">هنوز تراکنشی ثبت نشده است.</div>';
  return '<div class="acc-list">'+rows.map(function(r){
    return '<div class="acc-row"><div class="main"><b>'+esc(r.d)+'</b><small>'+dt(r.t)+'</small></div><span class="amt '+r.cls+'">'+r.amt+'</span></div>';
  }).join('')+'</div>';
}
function contractActions(c){
  var f=S.flow.rent?S.flow.rent.data:null,T=f?f.term:null,a='';
  if(c.kind==='rent'&&f&&f.signed){
    if(!T){a='<button class="btn btn-xs btn-primary" data-act="startTerm">شروع فسخ</button>'}
    else if(!T.paid){a='<button class="btn btn-xs btn-primary" data-act="startTerm">ادامهٔ فسخ — '+fa(T.ph,0)+'</button>'}
    else{a='<span class="badge b-ok">تسویه کامل</span>'}
  }
  return a;
}

function readPlaceForm(){
  var el=function(id){return document.getElementById(id)};
  var p=PLACE_TMP||{};
  p.label=el('pl-label')?el('pl-label').value.replace(/^\s+|\s+$/g,''):p.label;
  p.kind=el('pl-kind')?el('pl-kind').value:p.kind;
  p.prio=el('pl-prio')?+el('pl-prio').value:(p.prio||2);

function conCapture(D,kind){
  kind=kind||conKind();
  var c=conInit(D,kind);
  function v(id){var e=document.getElementById(id);return e?e.value.replace(/^\s+|\s+$/g,''):null}
  if(document.getElementById('cl-name')){
    var ln=v('cl-name'),li=(v('cl-id')||'').replace(/\D/g,''),lm=(v('cl-mobile')||'').replace(/\D/g,'');
    var on=v('co-name'),oi=(v('co-id')||'').replace(/\D/g,''),om=(v('co-mobile')||'').replace(/\D/g,'');
    if(ln)c.parties.lessee.name=ln;if(li)c.parties.lessee.id=li;if(lm)c.parties.lessee.mobile=lm;
    if(on)c.parties.lessor.name=on;if(oi)c.parties.lessor.id=oi;if(om)c.parties.lessor.mobile=om;
    c.parties.witnesses=[{name:v('cw1n')||'',mobile:(v('cw1m')||'').replace(/\D/g,'')},{name:v('cw2n')||'',mobile:(v('cw2m')||'').replace(/\D/g,'')}];
  }
  if(document.getElementById('cp-postal')){
    var po=(v('cp-postal')||'').replace(/\D/g,''),ar=+v('cp-area');
    if(po)c.prop.postal=po;if(ar)c.prop.area=ar;if(v('cp-addr')!==null)c.prop.addr=v('cp-addr');
    if(kind==='rent'){
      if(v('cp-start'))c.terms.start=v('cp-start');if(v('cp-dur'))c.terms.duration=v('cp-dur');
      var dp=+v('cp-dep'),rn=+v('cp-rent');if(dp)c.terms.deposit=dp;if(rn)c.terms.rent=rn;
      if(v('cp-pay'))c.terms.paymentDay=v('cp-pay');
    }else{
      var pr=+v('cp-price');if(pr)c.terms.price=pr;if(v('cp-delivery'))c.terms.delivery=v('cp-delivery');if(v('cp-payment'))c.terms.payment=v('cp-payment');
    }
    if(v('cp-notes')!==null)c.terms.notes=v('cp-notes');
  }
  return c;
}

  defPay(D);
  D.pay.n=+el.getAttribute('data-v');
  var p=[],base=Math.floor(100/D.pay.n),i;
  for(i=0;i<D.pay.n;i++){p.push(base)}
  p[D.pay.n-1]+=100-base*D.pay.n;
  D.pay.pcts=p;D.pay.ok=false;D.escD=0;D.escrow=false;
  save();renderCurrent();
};
ACT.payOk=function(){
  var D=wd('buy').data;
  defPay(D);
  if(D.pay.staged){
    var s=0;
    D.pay.pcts.forEach(function(x){s+=x});
    if(Math.abs(s-100)>0.01){toast('جمع باید ۱۰۰ — الان '+fa(s,0));return}
    var bad=false,i;
    for(i=0;i<D.pay.pcts.length;i++){if(D.pay.pcts[i]<1)bad=true}
    if(bad){toast('هر مرحله حداقل ۱٪');return}
  }
  D.pay.ok=true;D.escD=0;D.escrow=false;
  save();renderCurrent();toast('✓ توافق طرفین ثبت شد');
};
ACT.besc=function(){
  var D=wd('buy').data;
  if(!D.pay||!D.pay.ok)return;
  if(D.price===undefined){D.price=D.budg||300000000000}
  if(D.escD===undefined){D.escD=0}
  var stg=escStages(D);
  if(D.escD>=stg.length)return;
  if(D.escD===0){
    if(!spend('escrow','buy','پرداخت امانی'))return;
    D.escReq=addReq('buy','مبایعه','امانی — '+rial(D.price),'در حال انجام','توافق طرفین');
  }
  D.escD++;
  var all=true,i;
  for(i=0;i<stg.length;i++){if(D.escD<=i)all=false}
  if(all){D.escrow=true;if(D.escReq)setReq(D.escReq,'کامل شد')}
  save();toast('مرحلهٔ '+fa(D.escD,0)+' آزاد شد');renderCurrent();
};

ACT.paySubmit=function(el){
  var mode=el.getAttribute('data-m');
  var amt,title,cb;
  if(mode==='invb'){
    var D=wd('invb').data;
    amt=+(D.payAmt||'0');
    title='خرید سهم متری — '+INPRJ[D.ip||0].t;
    cb=function(){
      var m=Math.floor(amt/PPM.v);
      if(m<1){toast('برای ۱ متر کافی نیست');return}
      D.bought=true;D.meters=m;
      addReq('invb','پرداخت','خرید '+fa(m,0)+' متر','کامل شد',rial(amt)+' + ۰٫۵٪');
      save();renderCurrent();toast(' خرید موفق: '+fa(m,0)+' متر');
    };
  }else{
    var ctx=PAYM.ctx;
    if(!ctx)return;
    amt=+PAYM.amt;
    title=ctx.title;
    if(mode==='invr'){
      cb=function(){
        var cnt=Math.floor(amt/13200000);
        if(cnt<1){toast('برای ۱ توکن کافی نیست');return}
        var D2=wd('invr').data;
        D2.cnt=cnt;D2.fund=true;
        addReq('invr','پرداخت','خرید '+fa(cnt,0)+' توکن','کامل شد',rial(amt)+' + ۰٫۵٪');
        save();renderCurrent();toast(' '+fa(cnt,0)+' توکن');
      };
    }else{
      cb=function(){
        var tok=Math.round(amt/ctx.rate);
        if(tok<1){toast('کافی نیست');return}
        earn(tok,'sub',ctx.title);
        if(ctx.kind==='pack'){S.sub={name:ctx.packName||ctx.title.replace('بستهٔ ',''),tokens:tok,at:Date.now(),price:amt}}
        addReq('sub','پرداخت',ctx.title+' — '+fa(tok,0),'کامل شد',rial(amt));
        save();renderCurrent();
      };
    }
  }
  openGateway(amt,title,cb);
};

/* ═══ ۲۱) رویدادها ═══ */
function setMenuOpen(open){
  document.body.classList.toggle('sideopen',!!open);
  var b=document.querySelector('.menubtn');
  if(b){b.setAttribute('aria-expanded',open?'true':'false')}
}
document.addEventListener('keydown',function(e){
  var t=e.target;
  var modal=$('#modal-root');
  if(e.key==='Escape'){
    if(modal&&modal.classList.contains('on')){closeModal();return}
    if(document.body.classList.contains('sideopen')){setMenuOpen(false);return}
    return;
  }
  if(e.key==='Tab'&&modal&&modal.classList.contains('on')){
    var items=$$('#modal-root .modal button:not([disabled]),#modal-root .modal a[href],#modal-root .modal input:not([disabled]),#modal-root .modal select:not([disabled]),#modal-root .modal textarea:not([disabled]),#modal-root .modal [tabindex="0"]');
    if(!items.length)return;
    var first=items[0],last=items[items.length-1];
    if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}
    else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}
    return;
  }
  if((e.key==='Enter'||e.key===' ')&&t&&t.getAttribute&&t.getAttribute('role')==='button'){e.preventDefault();t.click()}
});
document.addEventListener('click',function(e){
  var t=e.target;
  if(!t||!t.closest)return;
  var el;
  if(document.body.classList.contains('sideopen')&&t.closest('#side')&&!t.closest('.sfh')){setMenuOpen(false)}
  el=t.closest('[data-cv]');
  if(el){
    var lab=(el.textContent||'').replace(/^\s+|\s+$/g,'');
    usrC(lab);
    ceVal(el.getAttribute('data-cv'));
    return;
  }
  el=t.closest('[data-cq]');
  if(el){
    ceSend(el.getAttribute('data-cq'));
    return;
  }
  el=t.closest('[data-cf]');
  if(el){
    usrC((el.textContent||'').replace(/^\s+|\s+$/g,''));
    ceStart(el.getAttribute('data-cf'));
    return;
  }
  el=t.closest('[data-cba]');
  if(el){
    var f2=CBACT[el.getAttribute('data-cba')];
    if(f2){f2(el)}
    return;
  }
  el=t.closest('[data-w]');
  if(el){
    wizardNav(el.getAttribute('data-m'),el.getAttribute('data-w'));
    return;
  }
  el=t.closest('[data-jump]');
  if(el){
    jumpTo(el.getAttribute('data-m'),+el.getAttribute('data-jump'));
    return;
  }
  el=t.closest('[data-act]');
  if(el){
    var f=ACT[el.getAttribute('data-act')];
    if(f){f(el,e)}
    return;
  }
  el=t.closest('[data-view]');
  if(el){go(el.getAttribute('data-view'))}
});
document.addEventListener('click',function(e){var b=e.target&&e.target.closest?e.target.closest('[data-imp]'):null;if(b){ceImpSet(b.getAttribute('data-imp'),+b.getAttribute('data-v'));return}});
document.addEventListener('change',function(e){var n=e.target&&e.target.closest?e.target.closest('[data-pt-num]'):null;if(n){ceNumSet(n.getAttribute('data-pt-num'),n.value);return}});
document.addEventListener('input',function(e){
  var t=e.target;
  if(!t||!t.hasAttribute)return;
  if(t.hasAttribute('data-paytxt')){
    var dg=pd(t.value).replace(/[^0-9]/g,'').slice(0,14);
    t.value=dg;
    var amt=+dg||0;
    var rate=PAYM.ctx?PAYM.ctx.rate:1;
    var unit=PAYM.ctx?PAYM.ctx.unit:'';
    var fee=Math.round(amt*0.005);
    var eA=document.getElementById('pay-amt');if(eA){eA.textContent=rial(amt)}
    var eU=document.getElementById('pay-units');if(eU){eU.textContent=fa(Math.floor(amt/rate),0)+' '+unit}
    var eF=document.getElementById('pay-fee');if(eF){eF.textContent=rial(fee)}
    var eT=document.getElementById('pay-total');if(eT){eT.textContent=rial(amt+fee)}
    if(PAYM.mode==='invb'){wd('invb').data.payAmt=dg;save()}
    else if(PAYM.ctx){PAYM.amt=dg}
    return;
  }
  if(t.hasAttribute('data-ep')){
    var pi=+t.getAttribute('data-ep');
    var DP=wd('buy').data;
    defPay(DP);
    var v=pd(t.value).replace(/[^0-9]/g,'').slice(0,3);
    t.value=v;
    DP.pay.pcts[pi]=+v||0;
    var s=0;
    DP.pay.pcts.forEach(function(x){s+=x});
    var eS=document.getElementById('paysum');
    if(eS){eS.textContent='جمع: '+fa(s,0);eS.style.color=(Math.abs(s-100)<0.01?'#2e9e5b':'#d9534f')}
    save();
    return;
  }
  if(t.hasAttribute('data-dt')){
    var k=t.getAttribute('data-dt'),side=+t.getAttribute('data-side');
    var DB=wd('buy').data;
    defPR(DB);
    var tgt=(k==='floorR')?DB.PR.floorR:DB.PR[k];
    var mn=+t.getAttribute('data-min'),mx=+t.getAttribute('data-max');
    var v2=pd(t.value).replace(/[^0-9]/g,'');
    t.value=v2;
    if(v2!==''){
      var n=Math.max(mn,Math.min(mx,+v2));
      tgt[side]=n;save();drLabel(k,tgt);
      var row=t.parentNode;
      if(row){
        var rg=row.querySelector('[data-dr="'+k+'"][data-side="'+side+'"]');
        if(rg){rg.value=n}
      }
    }
    return;
  }
  if(t.hasAttribute('data-tk')){
    var k2=t.getAttribute('data-tk');
    var row2=t.parentNode;
    var rg2=row2?row2.querySelector('[data-rk="'+k2+'"]'):null;
    var v3=pd(t.value).replace(/[^0-9]/g,'');
    if(rg2&&v3!==''){
      var n2=+v3;
      if(!isNaN(n2)){
        var mn2=+rg2.getAttribute('data-min');
        var mx2=+rg2.getAttribute('data-max');
        n2=Math.max(mn2,Math.min(mx2,n2));
        rg2.value=n2;
        var ev;
        try{ev=new Event('input');rg2.dispatchEvent(ev)}catch(e2){}
      }
    }
    return;
  }
  if(t.hasAttribute('data-rk')){
    var k3=t.getAttribute('data-rk');
    var row3=t.parentNode;
    var tx=row3?row3.querySelector('[data-tk="'+k3+'"]'):null;
    if(tx){tx.value=t.value}
    var lb=row3?row3.querySelector('[data-lbl="'+k3+'"]'):null;
    if(!lb){
      lb=row3?row3.querySelector('b[id="rv-'+k3+'"]'):null;
    }
    if(!lb){
      var all=row3?row3.querySelectorAll('b'):[];
      var j;
      for(j=0;j<all.length;j++){
        if(all[j].id===('rv-'+k3)){lb=all[j];break}
      }
    }
    if(lb&&RNGF[k3]){lb.textContent=RNGF[k3](+t.value)}
  }
});
