<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>محلینو</title>
<meta name="application-name" content="محلینو">
<meta name="apple-mobile-web-app-title" content="محلینو">
<meta name="description" content="محلینو — سامانهٔ جامع مسکن">
<link rel="stylesheet" href="./assets/leaflet/leaflet.css">
<style>
/* ═══ محلینو — V0.16 ═══
   A quieter, task-first layer: one accent, flat surfaces, no decorative gradients.
   Tokens → base → chrome → primitives → components → responsive. */

@font-face{font-family:'IRANSansX';src:url('./IRANSansX-Regular.woff2') format('woff2');font-weight:normal;font-style:normal;font-display:swap}
@font-face{font-family:'IRANSansX';src:url('./IRANSansX-Bold.woff2') format('woff2');font-weight:700;font-style:normal;font-display:swap}
*,button,input,select,textarea{font-family:'IRANSansX','Vazirmatn',Tahoma,sans-serif !important}

:root{
  --bg:#f6f7f9;
  --surface:#ffffff;
  --surface-2:#f8fafc;
  --ink:#0f172a;
  --ink2:#334155;
  --muted:#64748b;
  --faint:#94a3b8;
  --line:#e2e8f0;
  --line-soft:#eef2f7;
  --brand:#0f766e;
  --brand-strong:#115e59;
  --brand2:#0d9488;
  --brand-ink:#115e59;
  --soft:#f0fdfa;
  --bline:#cceee9;
  --accent:#b45309;
  --accent-strong:#92400e;
  --asoft:#fffbeb;
  --danger:#b91c1c;
  --dsoft:#fef2f2;
  --ok:#15803d;
  --osoft:#f0fdf4;
  --info:#1d4ed8;
  --info-soft:#eff6ff;
  --dark:#0f172a;
  --dark-2:#1e293b;
  --r-sm:6px;
  --r-md:10px;
  --r-lg:12px;
  --r-xl:16px;
  --sp-1:4px;--sp-2:8px;--sp-3:12px;--sp-4:16px;--sp-5:20px;--sp-6:28px;
  --fs-xs:11px;--fs-sm:12.5px;--fs-md:13.5px;--fs-lg:15px;--fs-xl:22px;
  --sh:0 1px 2px rgba(15,23,42,.04);
  --sh-lg:0 24px 56px -20px rgba(15,23,42,.3);
  --font:'IRANSansX','Vazirmatn',Tahoma,sans-serif;
}

/* ─── base ─── */
*{box-sizing:border-box;margin:0;padding:0;scrollbar-width:thin;scrollbar-color:#cbd5e1 transparent}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:99px}
::-webkit-scrollbar-thumb:hover{background:#94a3b8}
::-webkit-scrollbar-track{background:transparent}
::selection{background:#ccfbf1;color:var(--ink)}
html{scroll-behavior:smooth}
body{font-family:var(--font);background:var(--bg);color:var(--ink);direction:rtl;line-height:1.8;font-size:14px;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;min-height:100vh}
button{font-family:inherit;cursor:pointer}
img{max-width:100%}
:focus-visible{outline:2px solid var(--brand2);outline-offset:2px;border-radius:6px}
[hidden]{display:none!important}
a{color:var(--brand);text-underline-offset:3px}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.skip{position:fixed;top:-70px;right:16px;z-index:400;background:var(--brand);color:#fff;padding:8px 16px;border-radius:8px;font-size:13px;transition:top .15s}
.skip:focus{top:10px;color:#fff}
#errbar{position:fixed;top:0;right:0;left:0;background:var(--danger);color:#fff;padding:8px 16px;font-size:12px;z-index:300;display:none;direction:rtl}

/* ─── fields ─── */
.fld{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:12px 14px;margin-bottom:10px}
.fld .fl{font-size:12.5px;font-weight:700;color:var(--ink2);margin-bottom:6px;display:block}
.fld .fh{font-size:11.5px;color:var(--muted);margin-top:6px;display:block;line-height:1.8}
.sus{border:1px dashed #d9b26a;background:#fffdf6}
.sus .lart{filter:saturate(.9)}
.numrow{display:flex;gap:8px;align-items:center}
.numrow .inp{flex:1}
.calc{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-md);padding:12px 14px}
.calc .kv{padding:5px 0}
.rngbox{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-md);padding:10px 12px}
select.inp{background:var(--surface);cursor:pointer}
.inp{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:9px;font-family:inherit;font-size:13.5px;background:var(--surface);color:var(--ink);transition:border-color .15s,box-shadow .15s}
.inp:hover{border-color:#cbd5e1}
.inp:focus,.tinp:focus,.ch-in input:focus,.fch-in input:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(13,148,136,.14)}
.inp::placeholder,.ch-in input::placeholder,.fch-in input::placeholder{color:var(--faint)}
textarea.inp{resize:vertical;line-height:1.9}
.tinp{width:126px;padding:4px 6px;border:1px solid var(--line);border-radius:7px;direction:ltr;text-align:center;font-family:inherit;font-size:11px;background:var(--surface);color:var(--ink);transition:border-color .15s,box-shadow .15s}
input[type=range]{width:100%;direction:ltr;accent-color:var(--brand);height:26px;cursor:pointer;-webkit-appearance:none;appearance:none;background:transparent}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:99px;background:#e2e8f0}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:16px;height:16px;margin-top:-6px;border-radius:50%;background:#fff;border:2px solid var(--brand);box-shadow:0 1px 3px rgba(15,23,42,.2);transition:transform .12s}
input[type=range]::-webkit-slider-thumb:hover{transform:scale(1.1)}
input[type=range]::-moz-range-track{height:4px;border-radius:99px;background:#e2e8f0}
input[type=range]::-moz-range-thumb{width:13px;height:13px;border-radius:50%;background:#fff;border:2px solid var(--brand);box-shadow:0 1px 3px rgba(15,23,42,.2)}
input[type=range]:focus-visible{outline:2px solid var(--brand2);outline-offset:4px;border-radius:8px}

/* ─── chrome ─── */
.topbar{position:sticky;top:0;z-index:60;background:rgba(255,255,255,.96);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.topbar-in{max-width:1320px;margin:auto;display:flex;align-items:center;gap:12px;padding:10px 20px;min-height:62px}
.brand{display:flex;align-items:center;gap:10px;color:var(--ink);font-weight:700;font-size:16.5px;cursor:pointer;white-space:nowrap;line-height:1.4;background:none;border:none;padding:0}
.brand .mark{width:34px;height:34px;border-radius:9px;background:var(--brand);display:grid;place-items:center;color:#fff;flex:none}
.brand small{display:block;font-size:10.5px;font-weight:400;color:var(--muted);line-height:1.5}
.menubtn{display:none;width:36px;height:36px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--ink2);cursor:pointer;place-items:center;flex:none;transition:border-color .15s,color .15s}
.menubtn:hover{border-color:var(--bline);color:var(--brand)}
#tokchip{display:flex;align-items:center;gap:8px;margin-inline-start:auto}
.tok{display:flex;align-items:center;gap:7px;background:var(--surface);border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:6px 12px;font-size:12.5px;cursor:pointer;transition:border-color .15s,background .15s;white-space:nowrap}
.tok:hover{border-color:var(--bline);background:var(--soft)}
.tok .ti{display:grid;place-items:center;color:var(--brand)}
.tok .ti svg{width:16px;height:16px}
.tok b{font-weight:700}
.tok .plus{color:var(--brand);font-weight:700;font-size:15px;line-height:1}

main{max-width:1320px;margin:auto;padding:22px 20px 56px}
.app{display:grid;grid-template-columns:260px minmax(0,1fr);gap:22px;align-items:start}
.side{position:sticky;top:78px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:8px;max-height:calc(100dvh - 96px);overflow:auto;align-self:start}
.sg{font-size:10.5px;font-weight:700;color:var(--faint);letter-spacing:.02em;margin:14px 10px 5px}
.side>.sg:first-child{margin-top:4px}
.sitem{display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:8px;font-size:13px;cursor:pointer;color:var(--ink2);transition:background .15s,color .15s;user-select:none}
.sitem .si,.sfh .si{width:20px;display:grid;place-items:center;flex:none;color:var(--muted)}
.sitem .si svg,.sfh .si svg{width:16px;height:16px}
.sitem:hover{background:var(--surface-2);color:var(--ink)}
.sitem.on{background:var(--soft);color:var(--brand-ink);font-weight:700;border-inline-start:2px solid var(--brand);padding-inline-start:8px}
.sitem.on .si,.sflow.cur .sfh .si{color:var(--brand)}
.sitem.sub{padding:5px 10px;font-size:12px;color:var(--muted);gap:8px}
.sitem.sub:hover{color:var(--ink)}
.sitem.sub.on{background:var(--soft);color:var(--brand-ink);font-weight:700}
.sitem.sub.go{color:var(--brand);font-weight:700}
.bd{margin-inline-start:auto;font-size:10.5px;background:var(--surface-2);border-radius:99px;padding:0 8px;min-width:22px;text-align:center;line-height:19px;color:var(--muted);white-space:nowrap;font-weight:700}
.bd.ok{background:var(--osoft);color:var(--ok)}
.bd.warn{background:var(--asoft);color:var(--accent-strong)}
.sflow{margin:1px 0}
.sfh{display:flex;align-items:center;gap:9px;width:100%;padding:7px 10px;border:none;background:none;border-radius:8px;font-size:13px;color:var(--ink2);cursor:pointer;text-align:start;transition:background .15s,color .15s;font-family:inherit}
.sfh:hover{background:var(--surface-2);color:var(--ink)}
.sfh .sfn{flex:1;min-width:0}
.sfh .bd{margin-inline-start:0}
.sfh .chev{width:7px;height:7px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(45deg);margin-top:-3px;opacity:.5;transition:transform .2s;flex:none}
.sflow.open>.sfh{background:var(--surface-2);color:var(--ink);font-weight:700}
.sflow.open>.sfh .chev{transform:rotate(225deg);margin-top:3px}
.sflow.cur>.sfh{color:var(--brand-ink);font-weight:700;position:relative}
.sflow.cur>.sfh::before{content:'';position:absolute;inset-inline-start:0;top:9px;bottom:9px;width:2px;border-radius:2px;background:var(--brand)}
.sfp{display:grid;grid-template-rows:0fr;transition:grid-template-rows .2s ease}
.sflow.open>.sfp{grid-template-rows:1fr}
.sfp-in{overflow:hidden;min-height:0;visibility:hidden;transition:visibility .2s;margin-inline-start:20px;padding-inline-start:6px;border-inline-start:1px solid var(--line)}
.sflow.open>.sfp>.sfp-in{visibility:visible;padding-top:3px;padding-bottom:4px}
.side-ov{display:none}
.view{display:none}
.view.on{display:block;animation:fu .24s ease}
@keyframes fu{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.grid{display:grid;gap:16px}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}

/* ─── primitives ─── */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:20px}
.card.tight{padding:14px 16px}
.ct{font-size:15px;font-weight:700;margin-bottom:12px;line-height:1.7;color:var(--ink)}
.chip{display:inline-flex;align-items:center;gap:5px;min-height:32px;padding:5px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:12.5px;color:var(--ink2);cursor:pointer;transition:border-color .15s,background .15s,color .15s;user-select:none;line-height:1.6;font-family:inherit}
button.chip{appearance:none}
.chip:hover{border-color:var(--bline);background:var(--surface-2)}
.chip.on{background:var(--soft);border-color:var(--brand);color:var(--brand-ink);font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:7px;align-items:center}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;padding:2px 8px;border-radius:6px;font-weight:700;line-height:1.9;white-space:nowrap}
.b-ok{background:var(--osoft);color:#166534}
.b-warn{background:var(--asoft);color:var(--accent-strong)}
.b-bad{background:var(--dsoft);color:#991b1b}
.b-info{background:var(--info-soft);color:var(--info)}
.b-brand{background:var(--soft);color:var(--brand-ink)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:38px;border:1px solid var(--line);background:var(--surface);color:var(--ink2);border-radius:9px;padding:8px 16px;font-size:13.5px;cursor:pointer;transition:border-color .15s,color .15s,background .15s;line-height:1.6;user-select:none;text-align:center}
.btn:hover{border-color:#cbd5e1;background:var(--surface-2);color:var(--ink)}
.btn:active{background:#f1f5f9}
.btn svg{flex:none}
.btn-primary{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:700}
.btn-primary:hover{background:var(--brand-strong);border-color:var(--brand-strong);color:#fff}
.btn-primary:active{background:#0b4f4a}
.btn-sm{min-height:32px;padding:5px 11px;font-size:12.5px;border-radius:8px}
.btn-xs{min-height:28px;padding:3px 9px;font-size:11.5px;border-radius:7px;gap:5px}
.btn-lg{min-height:44px;padding:10px 22px;font-size:14.5px;border-radius:10px}
.btn[disabled],.btn[aria-disabled="true"]{opacity:.5;cursor:not-allowed}
.btn[aria-disabled="true"]:hover{background:var(--surface);border-color:var(--line);color:var(--ink2)}
.btn-ghost{background:transparent}
.btn-danger{color:var(--danger);border-color:#fecaca}
.btn-danger:hover{background:var(--dsoft);border-color:#fca5a5;color:var(--danger)}
.srow{margin-bottom:12px}
.slab{display:flex;justify-content:space-between;align-items:center;font-size:12.8px;color:var(--ink2);margin-bottom:4px;gap:8px;flex-wrap:wrap}
.slab b{color:var(--brand-ink);font-size:12px;font-weight:700}
.gauge{height:8px;background:#eef2f7;border-radius:99px;overflow:hidden}
.gauge i{display:block;height:100%;border-radius:99px;background:var(--ok);width:0;transition:width .25s ease,background .25s}
.pbar{height:6px;background:#eef2f7;border-radius:99px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--brand);border-radius:99px;transition:width .25s ease}
.kv{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--line-soft);font-size:12.8px;flex-wrap:wrap;align-items:baseline}
.kv:last-child{border:none}
.kv span{color:var(--muted)}
.kv b{font-weight:700;color:var(--ink)}
.alert{border-radius:var(--r-md);padding:10px 13px;font-size:12.6px;border:1px solid;margin-top:8px;line-height:1.85}
.al-ok{background:var(--osoft);border-color:#bbf7d0;color:#166534}
.al-warn{background:var(--asoft);border-color:#fde68a;color:#854d0e}
.al-bad{background:var(--dsoft);border-color:#fecaca;color:#991b1b}
.seg{display:inline-flex;background:#eef2f7;border-radius:9px;padding:3px;gap:2px;flex-wrap:wrap;max-width:100%;overflow-x:auto}
.seg button{border:none;background:none;padding:6px 13px;border-radius:7px;font-size:12.5px;cursor:pointer;color:var(--ink2);font-family:inherit;transition:background .15s,color .15s;white-space:nowrap;min-height:30px}
.seg button:hover{color:var(--ink)}
.seg button.on{background:#fff;color:var(--brand-ink);font-weight:700;box-shadow:0 1px 2px rgba(15,23,42,.08)}
.note{font-size:12px;color:var(--muted);line-height:1.9}
.mini{font-size:13px;font-weight:700;margin:20px 0 9px;color:var(--ink2)}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:14px 16px}
.stat b{font-size:19px;font-weight:700;color:var(--ink);display:block;line-height:1.6}
.stat span{font-size:12px;color:var(--muted)}
.empty{padding:26px 16px;text-align:center;color:var(--muted);font-size:12.8px;border:1px dashed var(--line);border-radius:var(--r-md);background:var(--surface-2)}

/* ─── page heads, flow status ─── */
.wtop{display:flex;align-items:flex-start;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.wtop>div:first-child{flex:1;min-width:220px}
.wtop h2{font-size:var(--fs-xl);font-weight:700;line-height:1.6;letter-spacing:-.01em}
.wtop p{font-size:var(--fs-sm);color:var(--muted);margin-top:2px;max-width:760px}
.wtop .head-actions{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.wprog{background:var(--soft);color:var(--brand-ink);border:1px solid var(--bline);border-radius:999px;padding:3px 12px;font-size:11.5px;font-weight:700;white-space:nowrap}

.flowstatus{border:1px solid var(--line);background:var(--surface);border-radius:var(--r-lg);padding:12px 14px;margin-bottom:12px}
.flowstatus.has-open{border-color:var(--bline);background:var(--surface)}
.fs-row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.fs-ic{width:34px;height:34px;border-radius:9px;background:var(--soft);color:var(--brand);display:grid;place-items:center;flex:none}
.fs-main{flex:1;min-width:200px}
.fs-main b{font-size:13.2px;font-weight:700;display:block;line-height:1.7}
.fs-meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:11.5px;color:var(--muted);margin-top:2px}
.fs-actions{display:flex;gap:6px;flex-wrap:wrap}
.fs-empty{font-size:12.4px;color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.fs-note{font-size:11.5px;color:var(--muted);margin-top:6px;line-height:1.8}

/* ─── stepper ─── */
.steps{display:flex;margin:0 0 16px;padding:14px 8px 11px;overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);scrollbar-width:thin}
.st{flex:1 0 78px;position:relative;text-align:center;padding:0 4px;font-size:11px;color:var(--muted);background:none;border:none;font-family:inherit}
.st:not(:last-child)::after{content:'';position:absolute;top:12px;right:50%;width:100%;height:1px;background:var(--line);z-index:0}
.st.done:not(:last-child)::after{background:#86efac}
.st b{display:block;font-size:10.8px;font-weight:400;color:var(--muted);line-height:1.5;margin-top:2px}
.st .stn{position:relative;z-index:1;display:grid;place-items:center;width:25px;height:25px;margin:0 auto 5px;border-radius:50%;background:#f1f5f9;color:var(--muted);font-size:11px;font-weight:700;box-shadow:0 0 0 3px var(--surface)}
.st.cur .stn{background:var(--brand);color:#fff;box-shadow:0 0 0 3px var(--surface),0 0 0 4px var(--bline)}
.st.cur b{color:var(--brand-ink);font-weight:700}
.st.done .stn{background:#dcfce7;color:#166534}
.st.done b{color:var(--ink2)}
.st[data-jump]{cursor:pointer}
.st[data-jump]:hover b{color:var(--brand)}
.wnav{display:flex;gap:10px;align-items:center;margin-top:18px;flex-wrap:wrap;position:sticky;bottom:12px;z-index:20;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:9px 12px;padding-inline-end:78px}
.wnav .note{flex:1;text-align:center;min-width:130px}
.wnav .btn-primary{margin-inline-start:auto}
.switch{position:relative;display:inline-block;width:38px;height:22px;flex:none;vertical-align:middle}
.switch input{position:absolute;opacity:0;width:0;height:0}
.switch .tr{position:absolute;inset:0;background:#cbd5e1;border-radius:99px;transition:background .2s;cursor:pointer}
.switch .tr::before{content:'';position:absolute;top:3px;right:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 2px rgba(15,23,42,.25)}
.switch input:checked+.tr{background:var(--brand)}
.switch input:checked+.tr::before{transform:translateX(-16px)}
.switch input:focus-visible+.tr{outline:2px solid var(--brand2);outline-offset:2px}
.cmpbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--soft);border:1px solid var(--bline);border-radius:var(--r-md);padding:9px 13px;font-size:12.8px;margin-bottom:13px}
.cmpbar .note{flex:1;min-width:110px}
.reqbar{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);margin:0;overflow:hidden}
.reqbar-h{display:flex;align-items:center;gap:9px;width:100%;padding:9px 12px;border:none;background:none;cursor:pointer;font-size:12.8px;font-weight:700;color:var(--ink2);text-align:start;flex-wrap:wrap;font-family:inherit;transition:background .15s;min-height:44px}
.reqbar-h:hover{background:var(--surface-2)}
.reqbar-h .chev{width:6px;height:6px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:rotate(45deg);margin-top:-2px;opacity:.55;transition:transform .2s;flex:none}
.reqbar.open .reqbar-h .chev{transform:rotate(225deg);margin-top:2px}
.reqbar-h .sp{flex:1}
.reqbar-b{padding:2px 12px 12px;border-top:1px solid var(--line-soft)}

/* ─── listing cards ─── */
.ph{position:relative;overflow:hidden;height:100%;background:#e2e8f0}
.ph .fb{position:absolute;inset:0;display:grid;place-items:center;color:#94a3b8;font-size:22px}
.ph .fb::after{content:'بدون تصویر';font-size:10.5px;color:#94a3b8;letter-spacing:.02em}
.ph img{position:relative;width:100%;height:100%;object-fit:cover;display:block;z-index:1}
.lart{position:relative;height:160px;overflow:hidden;background:#e2e8f0}
.lcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;display:flex;flex-direction:column;transition:border-color .15s}
.lcard:hover{border-color:#cbd5e1}
.lcard.sel{border-color:var(--brand);box-shadow:0 0 0 1px var(--brand)}
.lart .match{position:absolute;top:8px;right:8px;background:rgba(15,23,42,.78);color:#fff;font-size:10.5px;padding:2px 9px;border-radius:6px;z-index:3}
.lbody{padding:12px 14px;display:flex;flex-direction:column;gap:6px;flex:1}
.lbody h4{font-size:13.2px;font-weight:700;line-height:1.7}
.adr{font-size:11.5px;color:var(--muted)}
.ltags{display:flex;flex-wrap:wrap;gap:4px}
.ltags span{font-size:10.5px;background:var(--surface-2);color:var(--ink2);padding:2px 7px;border-radius:5px;border:1px solid var(--line-soft)}
.lfoot{display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:9px;border-top:1px solid var(--line-soft);gap:8px;flex-wrap:wrap}
.lfoot .pr b{font-size:13px;color:var(--brand-ink)}
.lfoot .pr span{font-size:10.5px;color:var(--muted);display:block}

/* ─── tables ─── */
.tblwrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md)}
.tbl{width:100%;border-collapse:collapse;font-size:12.6px;min-width:440px}
.tbl th{text-align:right;padding:9px 13px;color:var(--muted);font-size:11.5px;border-bottom:1px solid var(--line);background:var(--surface-2);font-weight:700;white-space:nowrap}
.tbl td{padding:9px 13px;border-bottom:1px solid var(--line-soft);text-align:right}
.tbl tr:last-child td{border-bottom:none}
.tbl tbody tr:hover td,.tbl tr:hover td{background:#fbfcfd}
#v-auth{max-width:410px;margin:44px auto}
#v-auth .card{padding:24px}

/* ─── packs ─── */
.pack{border:1px solid var(--line);border-radius:var(--r-lg);padding:20px;background:var(--surface);text-align:center;position:relative;display:flex;flex-direction:column}
.pack.best{border-color:var(--brand);box-shadow:0 0 0 1px var(--brand)}
.pack .pk{font-size:14.5px;font-weight:700}
.pack .pt{font-size:17px;font-weight:700;color:var(--brand-ink);margin:5px 0}
.pack ul{list-style:none;text-align:right;font-size:var(--fs-sm);color:var(--ink2);margin:9px 0 0;padding:0;display:grid;gap:5px}
.pack ul li{padding:2px 0}
.pack .btn{margin-top:auto}
.badge-best{position:absolute;top:-9px;right:14px;background:var(--accent);color:#fff;font-size:10.5px;font-weight:700;padding:1px 10px;border-radius:999px}
.packs-row{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}

/* ─── timeline / charts ─── */
.tl{position:relative;padding-right:22px;margin-top:8px}
.tl::before{content:'';position:absolute;right:7px;top:8px;bottom:8px;width:1px;background:var(--line)}
.tli{position:relative;padding:6px 0;font-size:12.8px}
.tli .dot{position:absolute;right:-22px;top:10px;width:15px;height:15px;border-radius:50%;background:var(--surface);border:1.5px solid #cbd5e1;display:grid;place-items:center;font-size:8px;color:transparent}
.tli.done .dot{background:var(--ok);border-color:var(--ok);color:#fff}
.tli.act .dot{border-color:var(--accent);color:var(--accent)}
.tli small{display:block;color:var(--muted);font-size:11.5px}
.chart{width:100%;height:auto;display:block}
.chart .cg{stroke:var(--line-soft);stroke-width:1}
.chart .cl,.chart .xl{fill:var(--faint);font-size:9.5px;font-family:'IRANSansX',Tahoma;direction:ltr}
.chart .cline{fill:none;stroke:var(--brand);stroke-width:2.2;stroke-linecap:round}
.chart .carea{fill:rgba(15,118,110,.08)}
.chart .cp{fill:#fff;stroke:var(--brand);stroke-width:2}
.chart .cbv{font-size:9.5px;font-family:'IRANSansX',Tahoma;font-weight:700}

/* ─── modal / toast ─── */
#modal-root{position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:110;display:none;align-items:center;justify-content:center;padding:20px}
#modal-root.on{display:flex}
.modal{background:var(--surface);border-radius:var(--r-xl);max-width:640px;width:100%;max-height:88dvh;overflow:auto;padding:24px;box-shadow:var(--sh-lg);animation:pop .22s ease}
@keyframes pop{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.modal h3{font-size:16.5px;margin-bottom:7px;line-height:1.7}
.modal:focus{outline:none}
.modal h3:focus{outline:none}
#toast-root{position:fixed;bottom:20px;right:50%;transform:translateX(50%);z-index:130;display:flex;flex-direction:column;gap:8px;align-items:center;max-width:92vw}
.toast{background:var(--dark);color:#fff;padding:10px 18px;border-radius:9px;font-size:12.8px;box-shadow:0 10px 24px -10px rgba(15,23,42,.4);animation:tin .22s ease}
@keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.codebox{background:var(--dark);color:#5eead4;border-radius:var(--r-md);padding:13px;text-align:center;font-size:23px;font-weight:700;letter-spacing:8px;direction:ltr;margin:10px 0}

/* ─── before/after ─── */
.ba{position:relative;border-radius:10px;overflow:hidden;height:210px;user-select:none;margin:8px 0;background:#e2e8f0}
.ba .layer{position:absolute;inset:0}
.ba .cap{position:absolute;bottom:8px;right:10px;background:rgba(15,23,42,.75);color:#fff;font-size:10.5px;padding:2px 9px;border-radius:6px;z-index:4}
.ba .after{clip-path:inset(0 0 0 45%)}
.ba .handle{position:absolute;top:0;bottom:0;width:2px;background:#fff;left:55%;z-index:5;box-shadow:0 0 6px rgba(0,0,0,.35)}
.ba input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:ew-resize;z-index:6}
.mk{position:absolute;width:24px;height:24px;border-radius:50%;background:var(--danger);border:2px solid #fff;display:grid;place-items:center;color:#fff;font-size:11px;font-weight:700;cursor:help;z-index:4}

/* ─── home / hero ─── */
.hero{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-xl);padding:30px 28px;color:var(--ink);overflow:hidden}
.hero::before{display:none}
.hero>*{position:relative;z-index:1}
.hero h1{font-size:25px;font-weight:700;line-height:1.65;max-width:700px;letter-spacing:-.01em}
.hero h1 em{font-style:normal;color:var(--brand)}
.hero p{color:var(--muted);margin-top:8px;max-width:620px;font-size:13.5px}
.hero .qa{display:flex;gap:8px;margin-top:20px;flex-wrap:wrap}
.hero .btn:not(.btn-primary){background:var(--surface);border-color:var(--line);color:var(--ink2)}
.hero .btn:not(.btn-primary):hover{background:var(--surface-2);border-color:#cbd5e1;color:var(--ink)}
.sec{display:flex;align-items:baseline;gap:10px;margin:26px 0 12px}
.sec h3{font-size:15.5px;font-weight:700}
.sec span{font-size:12px;color:var(--muted)}
.resume{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--asoft);border:1px solid #fde68a;border-radius:var(--r-lg);padding:11px 14px;margin-top:14px}
.resume b{font-size:12.5px;color:#854d0e}
.resume .chips{flex:1}
.mcard{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px;cursor:pointer;transition:border-color .15s,background .15s;text-align:start;font-family:inherit;color:inherit}
.mcard:hover{border-color:#cbd5e1;background:#fdfdfe}
.mcard .mi{width:40px;height:40px;border-radius:10px;background:var(--soft);color:var(--brand-ink);display:grid;place-items:center;margin-bottom:11px}
.mcard .mi svg{width:21px;height:21px}
.mcard h3{font-size:14.5px;font-weight:700;margin-bottom:3px}
.mcard p{font-size:12.2px;color:var(--muted);flex:1;margin-bottom:10px}
.mcard .mstate{font-size:11.5px;color:var(--muted);margin-bottom:8px}
.mcard .mstate b{color:var(--brand-ink)}
.mcard .go{color:var(--brand);font-size:12.5px;font-weight:700}
.flowcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px;cursor:pointer;transition:border-color .15s,background .15s;text-align:start;font-family:inherit;color:inherit;width:100%}
.flowcard:hover{border-color:#cbd5e1;background:#fdfdfe}
.flowcard .fi{color:var(--brand);margin-bottom:7px}
.flowcard .fi svg{width:24px;height:24px}
.flowcard h3{font-size:14px;font-weight:700;margin-bottom:7px}
.svc-ic{width:44px;height:44px;border-radius:11px;background:var(--soft);color:var(--brand);display:grid;place-items:center;flex:none}
.svc-ic svg{width:22px;height:22px}

/* ─── assistant ─── */
.chero{padding:0}
.chero>.ch{margin:auto}
.ch{max-width:1080px;margin:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;display:flex;flex-direction:column;height:min(580px,calc(100dvh - 210px));min-height:400px}
.ch-h{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--surface)}
.ch-h .av{width:36px;height:36px;border-radius:9px;background:var(--brand);display:grid;place-items:center;font-size:18px;color:#fff;flex:none}
.ch-h .chttl{flex:1;min-width:0}
.ch-h b{font-size:14.5px;display:block;line-height:1.6}
.ch-h small{font-size:11.5px;color:var(--muted);display:block;line-height:1.6}
.ch-h .chact{display:flex;gap:5px;align-items:center}
.ch-b{flex:1;overflow-y:auto;padding:16px;background:var(--surface-2);display:flex;flex-direction:column;gap:9px}
.msg{display:flex;max-width:min(92%,680px)}
.msg.user{max-width:min(86%,560px)}
.msg.bot{align-self:flex-start}
.msg.user{align-self:flex-end}
.msg .bub{background:var(--surface);border:1px solid var(--line);border-radius:12px 12px 12px 4px;padding:9px 13px;font-size:13px;line-height:1.9}
.msg.user .bub{background:var(--brand);color:#fff;border-color:var(--brand);border-radius:12px 12px 4px 12px}
.qr{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.qr button{background:var(--surface);border:1px solid var(--bline);color:var(--brand-ink);border-radius:999px;padding:5px 11px;font-size:11.8px;cursor:pointer;font-family:inherit;font-weight:700;transition:background .15s,border-color .15s;min-height:30px}
.qr button:hover{background:var(--soft);border-color:var(--brand)}
.ch-in{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line);background:var(--surface)}
.ch-in input{flex:1;border:1px solid var(--line);border-radius:8px;padding:9px 12px;font-family:inherit;font-size:13.5px;background:var(--surface);color:var(--ink)}
.ch-in button{background:var(--brand);color:#fff;border:none;border-radius:8px;padding:9px 20px;font-family:inherit;font-weight:700;cursor:pointer;transition:background .15s;min-height:38px}
.ch-in button:hover{background:var(--brand-strong)}
.chcards{display:grid;grid-template-columns:1fr;gap:7px;margin-top:8px}
.ccard{border:1px solid var(--line);border-radius:9px;padding:8px;display:flex;gap:9px;align-items:center;flex-wrap:wrap;background:var(--surface)}
.ccard .cthumb{width:68px;height:50px;border-radius:6px;overflow:hidden;flex:none;background:#e2e8f0}
.ccard .cthumb img{width:100%;height:100%;object-fit:cover}
.ccard .cb{flex:1;min-width:150px}
.ccard .cb b{font-size:12.3px;display:block;line-height:1.7}
.ccard .cb small{font-size:10.8px;color:var(--muted);display:block;line-height:1.9}
.ccard .btns{display:flex;gap:4px;flex-wrap:wrap}
.ctbl{width:100%;border-collapse:collapse;font-size:11.5px;margin-top:6px}
.ctbl th,.ctbl td{border:1px solid var(--line);padding:5px 7px;text-align:center}
.ctbl th{background:var(--surface-2);font-weight:700;color:var(--ink2)}
.cstep{display:flex;align-items:center;gap:8px;padding:7px 14px;border-bottom:1px solid var(--line-soft);background:var(--surface);font-size:11.5px;color:var(--muted)}
.cstep .bar{flex:1;height:4px;border-radius:99px;background:#eef2f7;overflow:hidden}
.cstep .bar i{display:block;height:100%;background:var(--brand);width:0;transition:width .25s}
.cstep b{color:var(--brand-ink);font-weight:700}
.chat-sugg{display:flex;gap:6px;overflow-x:auto;padding:8px 10px;border-top:1px solid var(--line-soft);background:var(--surface);scrollbar-width:none}
.chat-sugg::-webkit-scrollbar{display:none}
.qbtn{flex:none;display:inline-flex;align-items:center;gap:5px;background:var(--surface);border:1px solid var(--line);color:var(--ink2);border-radius:999px;padding:5px 11px;font-size:11.8px;cursor:pointer;font-family:inherit;white-space:nowrap;min-height:30px}
.qbtn:hover{border-color:var(--bline);background:var(--soft);color:var(--brand-ink)}
.qbtn.primary{background:var(--soft);border-color:var(--bline);color:var(--brand-ink);font-weight:700}
.fch-sugg{display:flex;gap:6px;overflow-x:auto;padding:8px 10px;border-top:1px solid var(--line-soft);background:var(--surface);scrollbar-width:none}
.fch-sugg::-webkit-scrollbar{display:none}
.landing-grid{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:16px;align-items:start}
.sidepanel{border:1px solid var(--line);border-radius:var(--r-lg);background:var(--surface);padding:16px}
.sidepanel h3{font-size:13.5px;font-weight:700;margin-bottom:8px}
.sidepanel .note{margin-bottom:10px}
.panel-list{display:grid;gap:6px}
.panel-item{display:flex;align-items:center;gap:9px;padding:8px 9px;border:1px solid var(--line);border-radius:9px;background:var(--surface);text-align:start;font-family:inherit;color:var(--ink2);cursor:pointer;font-size:12.5px}
.panel-item:hover{border-color:var(--bline);background:var(--soft);color:var(--brand-ink)}
.panel-item .pi{display:grid;place-items:center;color:var(--brand);flex:none}
.panel-item .ps{margin-inline-start:auto;color:var(--muted);font-size:11px}

/* ─── floating assistant ─── */
#fcbfab{position:fixed;bottom:20px;left:20px;z-index:95;width:50px;height:50px;border-radius:50%;border:none;background:var(--brand);color:#fff;cursor:pointer;display:none;font-size:20px;place-items:center;box-shadow:0 8px 20px -6px rgba(15,118,110,.45);transition:background .15s}
#fcbfab:hover{background:var(--brand-strong)}
#fcbfab.on{display:grid}
.fchw{position:fixed;bottom:20px;left:20px;z-index:100;width:376px;max-width:calc(100vw - 32px);height:540px;max-height:calc(100dvh - 40px);background:var(--surface);border-radius:var(--r-lg);border:1px solid var(--line);box-shadow:var(--sh-lg);display:none;flex-direction:column;overflow:hidden}
.fchw.on{display:flex}
.fch-h{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line);font-weight:700;font-size:13px}
.fch-h .hico{display:grid;place-items:center;color:var(--brand)}
.fch-h b{flex:1;min-width:0}
.hbtn{background:none;border:0;border-radius:6px;font-size:11.5px;cursor:pointer;color:var(--muted);min-height:28px;padding:3px 8px;font-family:inherit}
.hbtn:hover{color:var(--ink);background:var(--surface-2)}
.hbtn[disabled]{opacity:.4;cursor:not-allowed}
.csum .hbtn{font-size:10.5px;white-space:nowrap}
.fch-b{flex:1;overflow-y:auto;padding:11px;background:var(--surface-2);display:flex;flex-direction:column;gap:8px}
.fch-in{display:flex;gap:7px;padding:8px;border-top:1px solid var(--line)}
.fch-in input{flex:1;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-family:inherit;font-size:12.5px;background:var(--surface);color:var(--ink)}
.fch-in button{background:var(--brand);color:#fff;border:none;border-radius:8px;padding:8px 14px;font-family:inherit;font-weight:700;cursor:pointer;transition:background .15s;min-height:36px}
.fch-in button:hover{background:var(--brand-strong)}

/* ─── checklist / escrow / signers ─── */
.vrow{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--line-soft);font-size:12.8px}
.vrow:last-child{border:none}
.vrow .vt{flex:1}
.vrow.ok .vt{text-decoration:line-through;color:var(--muted)}
.cbx{width:20px;height:20px;border-radius:5px;border:1.5px solid #cbd5e1;display:grid;place-items:center;cursor:pointer;background:var(--surface);color:transparent;font-size:11px;flex:none;transition:background .15s,border-color .15s;padding:0}
.cbx:hover{border-color:var(--brand)}
.cbx.on{background:var(--ok);border-color:var(--ok);color:#fff}
.vdel{border:none;background:none;color:#cbd5e1;font-size:16px;cursor:pointer;line-height:1;padding:2px 4px}
.vdel:hover{color:var(--danger)}
.signer{border:1px solid var(--line);border-radius:var(--r-md);padding:12px;margin-bottom:9px;background:var(--surface-2)}
.signer .sh{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:12.8px;margin-bottom:5px;gap:8px;flex-wrap:wrap}
.otp{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.otp input{flex:1;min-width:120px;direction:ltr;text-align:center;letter-spacing:4px}
.dots{display:inline-flex;gap:4px}
.dots i{width:5px;height:5px;border-radius:50%;background:var(--brand2);animation:bl 1s infinite}
.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
@keyframes bl{0%,80%,100%{opacity:.2}40%{opacity:1}}
.rail{display:flex;gap:7px;overflow-x:auto;padding:4px 2px 9px}
.rail button{flex:none;display:flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 11px;cursor:pointer;font-family:inherit;font-size:12.5px;color:var(--ink2)}
.rail button .n{width:20px;height:20px;border-radius:50%;background:#eef2f7;display:grid;place-items:center;font-size:10.5px;font-weight:700;color:var(--muted)}
.rail button.on{border-color:var(--brand);background:var(--soft);color:var(--brand-ink);font-weight:700}
.lyr{border-radius:var(--r-md);padding:11px 14px;margin-top:11px;font-size:12.4px}
.lyr h4{font-size:12.4px;margin-bottom:5px}
.lyr.red{background:var(--dsoft);border:1px solid #fecaca}.lyr.red h4{color:#991b1b}
.lyr.green{background:var(--osoft);border:1px solid #bbf7d0}.lyr.green h4{color:#166534}
.lyr ul{list-style:none;padding-right:4px}
.done-card{text-align:center;padding:30px 18px}
.done-card .bigicon{font-size:38px}
.esc{border:1px solid var(--line);border-radius:var(--r-md);padding:10px 12px;margin-bottom:7px;display:flex;align-items:center;gap:9px;flex-wrap:wrap;background:var(--surface-2)}
.esc.done{background:var(--osoft);border-color:#bbf7d0}
.esc.cur{border-color:#fcd34d;background:var(--asoft)}
.esc .nm{flex:1;min-width:130px;font-size:12.4px;font-weight:700}
.payamt{font-size:14.5px;margin:11px 0;text-align:center;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-md);padding:12px}
.payamt b{font-size:16px;color:var(--brand-ink);display:block}
.kpad{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:9px}
.kpad button{padding:12px;font-size:16.5px;font-weight:700;border:1px solid var(--line);background:var(--surface);border-radius:9px;cursor:pointer;font-family:inherit;transition:background .12s,border-color .12s;min-height:48px}
.kpad button:hover{background:var(--surface-2);border-color:#cbd5e1}
.kpad button:active{background:#f1f5f9}
.hcat{border:1px solid var(--line);border-radius:var(--r-md);padding:11px 13px;margin-bottom:9px;background:var(--surface-2)}
.hcat h5{font-size:12.8px;margin-bottom:7px}
.stars2{color:#d97706;font-size:12px;letter-spacing:1px}

/* ─── map / tour ─── */
#lfm{height:420px;border-radius:var(--r-md);border:1px solid var(--line);z-index:1;background:#eef2f7}
#lfm2{height:300px;border-radius:var(--r-md);border:1px solid var(--line);z-index:1;background:#eef2f7}
.mapbox{position:relative}
.mapnote{position:absolute;inset-inline:10px;bottom:10px;z-index:500;display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:9px 11px;background:var(--surface);border:1px solid var(--line);border-radius:9px;font-size:11.8px;color:var(--ink2);box-shadow:0 6px 18px -10px rgba(15,23,42,.35)}
.mapnote b{color:var(--ink)}
.leaflet-container{font-family:'IRANSansX',Tahoma;border-radius:var(--r-md);background:#eef2f7;font-size:12px}
.leaflet-popup-content{font-family:'IRANSansX',Tahoma;direction:rtl;margin:10px 12px;font-size:12.3px;line-height:1.85}
.leaflet-popup-content b{font-size:12.5px}
.leaflet-container .btn{min-height:28px;padding:3px 9px;font-size:11.5px;border-radius:7px;border:1px solid var(--line);background:var(--surface);color:var(--ink2);margin-top:4px;font-family:inherit;cursor:pointer;display:inline-flex;align-items:center;gap:4px}
.leaflet-container .btn-primary{background:var(--brand);border-color:var(--brand);color:#fff}
.leaflet-control-zoom a{font-family:Tahoma;font-size:17px;color:var(--ink2)}
.leaflet-bar{border:1px solid var(--line) !important;box-shadow:none !important}
.leaflet-bar a{background:#fff !important;border-bottom-color:var(--line) !important}
.mh-pin{background:none;border:none;display:grid;place-items:center}
.mh-pin span{display:block;width:13px;height:13px;border-radius:50%;background:var(--brand);border:3px solid #fff;box-shadow:0 0 0 1px rgba(15,23,42,.25)}
.mh-pin.work span{background:var(--info)}
.mh-pin.school span{background:var(--accent)}
.mh-pin.listing span{background:#334155;width:10px;height:10px}
.mh-pin.pick span{background:var(--danger)}
.mapfb{height:100%;display:flex;flex-direction:column;gap:8px;background:var(--surface);padding:14px;overflow:auto;font-size:12px;color:var(--ink2);border-radius:var(--r-md)}
.mapfb .mflist{display:grid;gap:6px}
.mapfb .mflist button{display:flex;align-items:center;gap:8px;text-align:start;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;cursor:pointer;font-family:inherit;font-size:12.2px;color:var(--ink2)}
.mapfb .mflist button:hover{border-color:var(--bline);background:var(--soft)}
.tourwrap{position:relative;height:250px;border-radius:10px;overflow:hidden;cursor:grab;background:#111;user-select:none;touch-action:pan-y}
.tourwrap:active{cursor:grabbing}
.tourimg{position:absolute;top:0;bottom:0;right:0;width:250%}
.tourimg img{width:100%;height:100%;object-fit:cover;display:block}
.tourhud{position:absolute;bottom:10px;left:10px;background:rgba(15,23,42,.82);color:#5eead4;border-radius:6px;padding:3px 12px;font-size:11.5px;font-weight:700;z-index:3}
.tourtag{position:absolute;top:10px;right:10px;background:rgba(15,23,42,.82);color:#fff;border-radius:6px;padding:3px 12px;font-size:10.5px;z-index:3}

/* ─── footer ─── */
footer{background:var(--surface);color:var(--muted);border-top:1px solid var(--line);margin-top:28px;padding:16px 20px;font-size:12.5px}
.foot-in{max-width:1320px;margin:auto;display:flex;align-items:center;gap:6px 20px;flex-wrap:wrap}
.foot-in .fb{margin-inline-end:auto;color:var(--ink2)}
.foot-in .fb b{color:var(--ink)}
footer .fl{cursor:pointer;padding:2px 0;transition:color .15s;border:none;background:none;font-family:inherit;font-size:12.5px;color:var(--muted)}
footer .fl:hover{color:var(--brand)}

/* ─── account panel ─── */
.acc-stats{display:grid;gap:12px;grid-template-columns:repeat(4,1fr)}
.acc-stats.g3{grid-template-columns:repeat(3,1fr)}
.acc-tabs{display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--line);margin:2px 0 18px;scrollbar-width:none}
.acc-tabs::-webkit-scrollbar{display:none}
.acc-tab{border:none;background:none;padding:10px 14px;font-size:13px;font-family:inherit;color:var(--muted);cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent;margin-bottom:-1px}
.acc-tab:hover{color:var(--ink)}
.acc-tab.on{color:var(--brand-ink);font-weight:700;border-bottom-color:var(--brand)}
.acc-hero{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:16px;align-items:stretch}
.acc-id{display:flex;gap:12px;align-items:center}
.acc-avatar{width:44px;height:44px;border-radius:50%;background:var(--soft);color:var(--brand-ink);display:grid;place-items:center;font-weight:700;font-size:16px;flex:none}
.acc-name b{font-size:16px;display:block;line-height:1.6}
.acc-name span{font-size:12px;color:var(--muted)}
.acc-balance{font-size:25px;font-weight:700;letter-spacing:-.01em;line-height:1.45}
.acc-balance small{font-size:11px;font-weight:400;color:var(--muted);display:block}
.acc-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.acc-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line-soft);font-size:12.6px}
.acc-row:last-child{border:none}
.acc-row .main{flex:1;min-width:0}
.acc-row .main b{display:block;font-size:12.8px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acc-row .main small{color:var(--muted);font-size:11px}
.acc-row .amt{font-weight:700;font-size:12.5px;white-space:nowrap}
.acc-row .amt.in{color:var(--ok)}
.acc-row .amt.out{color:var(--danger)}
.plan-badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;padding:2px 9px;border-radius:6px;background:var(--soft);color:var(--brand-ink);font-weight:700}
.place-item{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line-soft);flex-wrap:wrap}
.place-item:last-child{border:none}
.place-item .pi{width:30px;height:30px;border-radius:8px;background:var(--surface-2);color:var(--ink2);display:grid;place-items:center;flex:none}
.place-item .pm{flex:1;min-width:140px}
.place-item .pm b{display:block;font-size:12.8px}
.place-item .pm small{font-size:11px;color:var(--muted);line-height:1.8}
.prio{font-size:10.5px;padding:1px 7px;border-radius:5px;background:var(--surface-2);color:var(--muted);font-weight:700}
.prio.p1{background:var(--dsoft);color:#991b1b}
.prio.p2{background:var(--asoft);color:var(--accent-strong)}
.prio.p3{background:var(--surface-2);color:var(--muted)}

/* ─── services (third-party journey) ─── */
.svc-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.svc-cat h4{font-size:13.5px;margin-bottom:6px}
.svc-item{display:flex;justify-content:space-between;gap:8px;padding:9px 0;border-bottom:1px solid var(--line-soft);font-size:12.4px;align-items:center;flex-wrap:wrap}
.svc-item:last-child{border:none}
.svc-item .sdet{flex:1;min-width:140px}
.svc-item .sdet b{font-weight:700;display:block;line-height:1.7}
.svc-item .sdet small{color:var(--muted);font-size:11px;display:block;line-height:1.8}
.provider-card{display:flex;gap:12px;align-items:flex-start;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2)}
.provider-logo{width:38px;height:38px;border-radius:10px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;font-weight:700;color:var(--brand-ink);flex:none}
.ext-tag{font-size:10.5px;padding:1px 7px;border-radius:5px;background:var(--asoft);color:var(--accent-strong);font-weight:700;white-space:nowrap}
.svc-journey{display:grid;gap:6px;margin:10px 0}
.svc-step{display:flex;gap:8px;font-size:12px;color:var(--ink2);align-items:flex-start;line-height:1.8}
.svc-step .n{width:18px;height:18px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;font-size:10px;font-weight:700;color:var(--muted);flex:none;margin-top:2px}
.integration-note{font-size:11.5px;color:var(--accent-strong);background:var(--asoft);border:1px solid #fde68a;border-radius:8px;padding:8px 10px;line-height:1.9}
.svc-state{display:inline-flex;align-items:center;font-size:10.5px;padding:1px 7px;border-radius:5px;background:var(--info-soft);color:var(--info);font-weight:700}
.svc-state.done{background:var(--osoft);color:var(--ok)}
.svc-state.bad{background:var(--dsoft);color:var(--danger)}
.svc-state.warn{background:var(--asoft);color:var(--accent-strong)}

/* ─── financial bars ─── */
.finbars{display:grid;gap:8px;margin:10px 0 6px}
.fbar{display:grid;grid-template-columns:112px minmax(0,1fr) 88px;gap:8px;align-items:center;font-size:11.5px}
.fbar .lbl{color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fbar .tr{height:7px;background:#eef2f7;border-radius:99px;overflow:hidden}
.fbar .tr i{display:block;height:100%;background:var(--brand);border-radius:99px}
.fbar .val{text-align:left;font-weight:700;color:var(--ink);direction:ltr;font-size:11px}
.fbar.hi .tr i{background:var(--accent)}
.fin-note{font-size:10.5px;color:var(--muted);line-height:1.9;margin-top:6px}
.fin-note a{color:var(--brand-ink)}
.fin-src{margin-top:7px}
.fin-src summary{cursor:pointer;font-size:10.5px;color:var(--brand-ink);font-weight:700}
.fin-src .fin-note{margin-top:5px}
.fin-table{width:100%;border-collapse:collapse;font-size:11.5px;margin-top:8px;table-layout:fixed}
.fin-table th,.fin-table td{border-bottom:1px solid var(--line-soft);padding:6px 4px;text-align:right;overflow-wrap:anywhere}
.fin-table th:first-child,.fin-table td:first-child{width:42%}
.fin-table th{color:var(--muted);font-weight:700;font-size:10.5px;overflow-wrap:anywhere}
.fin-table td:not(:first-child){direction:ltr;text-align:left;overflow-wrap:anywhere}

/* ─── chat context / distances ─── */
.msg .fin-table{font-size:10.5px}
.msg .fin-table th,.msg .fin-table td{padding:4px 2px}
.mkt-line{display:flex;gap:10px;flex-wrap:wrap;font-size:11.5px;color:var(--ink2);border-top:1px solid var(--line-soft);margin-top:10px;padding-top:8px}
.mkt-card .stat b{font-size:14px;line-height:1.5;overflow-wrap:anywhere}
.mkt-row{display:grid;grid-template-columns:78px 1fr 54px;gap:8px;align-items:center;padding:5px 0;font-size:12px}
.mkt-row .mn{color:var(--ink2);font-weight:700}
.mkt-row .mbar{height:8px;background:var(--soft);border-radius:99px;overflow:hidden}
.mkt-row .mbar i{display:block;height:100%;background:var(--brand);border-radius:99px}
.mkt-row .mv{font-size:11px;color:var(--muted);direction:ltr;text-align:left}
.mkt-row.cur .mn,.mkt-row.cur .mv{color:var(--brand-ink)}
.ana-grid{display:grid;gap:12px;grid-template-columns:1fr 1fr}
.ana-row{display:grid;grid-template-columns:1fr auto;gap:2px 8px;border-bottom:1px solid var(--line-soft);padding:7px 0;font-size:12.5px}
.ana-row small{grid-column:1/-1;color:var(--muted);font-size:10.5px}
.ana-row b{text-align:left;direction:ltr;font-variant-numeric:tabular-nums}
.ana-row b.muted{font-family:inherit;direction:rtl}
.srcbox{margin-top:10px;border:1px solid var(--line-soft);border-radius:10px;padding:8px 10px;background:var(--soft)}
.srcbox summary{cursor:pointer;font-size:12px;font-weight:700;color:var(--ink2)}
.srcbox .note{font-size:11px;line-height:2}
.up{color:var(--ok)}.down{color:var(--danger)}.muted{color:var(--muted)}.ok{color:var(--ok)}.bad{color:var(--danger)}
.con-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.con-steps{display:flex;gap:4px;flex-wrap:wrap;margin:0 0 14px}
.con-step{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted);background:var(--card);border:1px solid var(--line-soft);border-radius:99px;padding:5px 10px}
.con-step span{width:18px;height:18px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:var(--soft);font-size:10px}
.con-step.cur{color:var(--brand-ink);border-color:var(--brand);background:var(--osoft)}
.con-step.cur span{background:var(--brand);color:#fff}
.con-step.done{color:var(--ink2)}
.con-step.done span{background:var(--ok);color:#fff}
.path-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px}
.path-card.best{border-color:var(--brand);box-shadow:0 0 0 1px var(--brand) inset}
.pc-head{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.pc-list{margin:0;padding-inline-start:18px;font-size:12px;line-height:1.9}
.path-summary{background:var(--soft);border-radius:10px;padding:10px;font-size:12.5px;margin:8px 0}
.con-journey{display:grid;gap:6px;margin:10px 0}
.con-journey-row{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;background:var(--soft);border-radius:9px;padding:8px 10px}
.con-journey-row span{width:20px;height:20px;border-radius:50%;background:var(--brand);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:10px;flex:0 0 auto}
.place-result{display:block;width:100%;text-align:start;background:var(--soft);border:1px solid var(--line-soft);border-radius:8px;padding:7px 9px;margin-top:6px;cursor:pointer}
.place-result b{display:block;font-size:12px}.place-result small{display:block;color:var(--muted);font-size:10.5px;line-height:1.6}
.lk-status{font-size:11px;line-height:1.8;margin-top:6px;min-height:16px}
.lk-status.load{color:var(--muted)}
.lk-status.ok{color:var(--ok)}
.lk-status.warn{color:#b7791f}
.lk-status.err{color:var(--danger)}
.costs-box{margin-top:14px;border:1px solid var(--line-soft);border-radius:12px;background:var(--card);padding:10px 12px}
.costs-box summary{cursor:pointer;font-weight:700;font-size:13px;color:var(--ink2)}
.costs-body{padding-top:8px}
.costs-body .ct{font-size:12px;margin-top:10px}
.doc-preview{max-height:460px;overflow:auto;background:#eef1f4;border:1px solid var(--line-soft);border-radius:10px;padding:8px;margin-top:10px}
.doc-preview .doc{max-width:none;box-shadow:none;margin:0;padding:18px}
.doc-actions{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.doc{max-width:820px;margin:0 auto;background:#fff;color:#17202b;border:1px solid #d9dee5;border-radius:4px;box-shadow:0 6px 24px rgba(15,35,50,.08);padding:28px 30px;position:relative;overflow:hidden;line-height:1.95;font-size:12.5px}
.doc-head{border-bottom:2px solid #17202b;padding-bottom:10px;margin-bottom:12px}
.doc-brand{display:flex;justify-content:space-between;align-items:baseline;font-weight:800;font-size:13px;color:#0e7c6b}
.doc-brand span{font-weight:500;font-size:10px;color:#667085}
.doc h1{font-size:21px;margin:14px 0 2px;text-align:center;letter-spacing:0}
.doc-sub{text-align:center;font-size:11px;color:#667085}
.doc-meta{display:grid;grid-template-columns:repeat(4,1fr);gap:6px 10px;background:#f6f8fa;border:1px solid #e3e8ee;border-radius:6px;padding:8px 10px;margin:10px 0;font-size:10.5px}
.doc-meta span{display:block;color:#667085;font-size:9.5px}
.doc-meta b{font-size:10.5px}
.doc-reg{border:1px solid #e3e8ee;border-radius:6px;padding:8px 10px;font-size:10.5px;margin:10px 0;line-height:1.8}
.doc-reg.ok{border-color:#bfe5cd;background:#f4fbf6}
.doc-reg.warn{border-color:#f1dfba;background:#fffbf1}
.doc-reg span{color:#667085;font-size:9.5px}
.doc-sec{margin:14px 0;break-inside:avoid}
.doc-sec h2{font-size:13px;border-inline-start:3px solid #0e7c6b;padding-inline-start:8px;margin:0 0 6px}
.doc p,.doc li{font-size:11.5px;margin:4px 0}
.doc ul{padding-inline-start:18px;margin:4px 0}
.doc-table{width:100%;border-collapse:collapse;font-size:10.5px;margin:6px 0;table-layout:fixed}
.doc-table th,.doc-table td{border:1px solid #d9dee5;padding:5px 6px;text-align:right;vertical-align:top;overflow-wrap:anywhere}
.doc-table th{background:#f6f8fa;font-weight:700}
.doc-note{font-size:9.5px;color:#667085;line-height:1.8}
.doc-watermark{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;font-size:52px;font-weight:900;color:rgba(180,35,24,.07);transform:rotate(-28deg);letter-spacing:4px;white-space:nowrap}
.doc.registered .doc-watermark{color:rgba(14,124,107,.07)}
.doc-foot{border-top:1px solid #d9dee5;margin-top:18px;padding-top:8px;font-size:9px;color:#667085;line-height:1.7}
.svc-tl{display:grid;gap:4px}
.svc-tlrow{display:flex;gap:8px;align-items:flex-start;padding:6px 0;border-bottom:1px solid var(--line-soft);font-size:12px}
.svc-tlrow .dot{width:9px;height:9px;border-radius:50%;background:var(--brand);margin-top:4px;flex:0 0 auto}
.svc-tlrow b{display:block;font-size:12px}.svc-tlrow small{color:var(--muted);font-size:10.5px}
.receipt{max-width:520px;margin:0 auto;background:#fff;border:1px solid #d9dee5;border-radius:8px;padding:18px;color:#17202b;direction:rtl;font-size:12px;line-height:2}
.receipt .rhead{display:flex;justify-content:space-between;border-bottom:2px solid #17202b;padding-bottom:8px;margin-bottom:10px;font-size:14px}
.receipt .rrow{display:flex;justify-content:space-between;gap:10px;border-bottom:1px dashed #e3e8ee;padding:5px 0}
.receipt .rrow b{text-align:left;overflow-wrap:anywhere}
.receipt .rfoot{border-top:1px solid #d9dee5;margin-top:12px;padding-top:8px;color:#667085;font-size:10px}
.doc-sign .doc-note{margin-top:8px}
.doc-siglines{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0 0;font-size:10.5px;color:#374151}
.doc-siglines div{border-top:1px dashed #b9c0ca;padding-top:6px;margin-top:18px}
#print-root{display:none}
@media(max-width:800px){.con-steps{gap:3px}.con-step{font-size:10.5px;padding:4px 8px}.doc{padding:18px 14px}.doc-meta{grid-template-columns:1fr 1fr}.doc-table{font-size:9.5px}.doc-watermark{font-size:36px}}
@media print{
  @page{size:A4;margin:16mm 14mm}
  html,body{background:#fff!important}
  body.doc-printing>*:not(#print-root){display:none!important}
  body.doc-printing #print-root{display:block!important}
  #print-root .doc{max-width:none;width:auto;border:0;border-radius:0;box-shadow:none;padding:0;margin:0;font-size:10pt;line-height:1.85;overflow:visible}
  #print-root .doc-watermark{position:fixed;inset:0;font-size:64px;color:rgba(180,35,24,.06);print-color-adjust:exact}
  #print-root .doc.registered .doc-watermark{color:rgba(14,124,107,.06)}
  #print-root .doc-sec{break-inside:avoid}
  #print-root .doc-table{font-size:9.5pt}
  #print-root .doc-table tr{break-inside:avoid}
  #print-root .doc-foot{break-inside:avoid}
  #print-root .receipt{max-width:none;border:0;border-radius:0;padding:0}
}
@media(max-width:800px){.ana-grid{grid-template-columns:1fr}.mkt-row{grid-template-columns:64px 1fr 50px}.mkt-card .grid.g3{grid-template-columns:1fr}}
.msg .finbars{margin:6px 0 4px}
.msg .fbar{grid-template-columns:86px minmax(0,1fr) 62px;font-size:10.5px}
.msg .fin-note{font-size:10px}
.msg{flex-direction:column}
.msg.bot{align-items:flex-start}
.msg.user{align-items:flex-end}
.msg .who{font-size:10px;color:var(--faint);margin:0 3px 2px}
.csum{display:flex;align-items:center;gap:8px;padding:6px 12px;border-bottom:1px solid var(--line-soft);background:var(--surface-2);font-size:11px;color:var(--muted);overflow-x:auto;white-space:nowrap}
.csum b{color:var(--ink2);font-weight:700}
.csum button{margin-inline-start:auto}
.distlist{display:grid;gap:0}
.distrow{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--line-soft);font-size:12px}
.distrow:last-child{border:none}
.distrow .dn{flex:1;min-width:0;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.distrow .dd{font-weight:700;white-space:nowrap}
.distrow .dbar{width:64px;height:5px;background:#eef2f7;border-radius:99px;overflow:hidden;flex:none}
.distrow .dbar i{display:block;height:100%;background:var(--brand);border-radius:99px}
.distnote{font-size:10.5px;color:var(--muted);line-height:1.8;margin-top:6px}
.maplegend{display:flex;gap:10px;flex-wrap:wrap;font-size:10.5px;color:var(--muted);margin-top:6px}

<script>
/* ═══ ۱) ابزار ═══ */
function $(s){return document.querySelector(s)}

function fa(n,d){if(d===undefined)d=0;n=Number(n);if(isNaN(n))n=0;return n.toLocaleString('fa-IR',{maximumFractionDigits:d})}

function dt(t){try{return new Date(t).toLocaleDateString('fa-IR',{month:'long',day:'numeric'})}catch(e){return ''}}
function fd(t){try{return new Date(t).toLocaleDateString('fa-IR',{year:'numeric',month:'long',day:'numeric'})}catch(e){return ''}}
function dateFa(v){if(!v)return '—';var n=(typeof v==='number')?v:Date.parse(v);return isNaN(n)?String(v):fd(n)}
function esc(t){return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;')}

var PD={'۰':'0','۱':'1','۲':'2','۳':'3','۴':'4','۵':'5','۶':'6','۷':'7','۸':'8','۹':'9'};
function pd(s){return String(s).replace(/[۰-۹]/g,function(c){return PD[c]})}
/* ═══ ۱.۵) فهم زبان طبیعی ═══ */
var NUM_WORDS={'یک':1,'یه':1,'دو':2,'سه':3,'چهار':4,'پنج':5,'شش':6,'شیش':6,'هفت':7,'هشت':8,'نه':9,'ده':10,'یازده':11,'دوازده':12,'سیزده':13,'چهارده':14,'پانزده':15,'شانزده':16,'هفده':17,'هجده':18,'نوزده':19,'بیست':20,'سی':30,'چهل':40,'پنجاه':50,'شصت':60,'هفتاد':70,'هشتاد':80,'نود':90,'صد':100,'دویست':200,'سیصد':300,'چهارصد':400,'پانصد':500,'ششصد':600,'هفتصد':700,'هشتصد':800,'نهصد':900};
var NUM_MULT={'هزار':1e3,'میلیون':1e6,'میلیارد':1e9};
function normFa(s){
  return String(s==null?'':s)
    .replace(/[۰-۹]/g,function(c){return PD[c]})
    .replace(/[٠-٩]/g,function(c){return String(c.charCodeAt(0)-1632)})
    .replace(/[،٬,]/g,'')
    .replace(/٫/g,'.')
    .replace(/ي/g,'ی').replace(/ك/g,'ک')
    .replace(/\u200c/g,' ')
    .replace(/\s+/g,' ')
    .trim();
}
function parseNumberWords(input){
  var t=normFa(input).replace(/ و /g,' ');
  if(!t)return {ok:false};
  if(/^-?\d+(\.\d+)?$/.test(t))return {ok:true,value:parseFloat(t),used:false,multi:false};
  var parts=t.split(' ').filter(Boolean),total=0,current=0,used=false,multi=false,i,w;
  for(i=0;i<parts.length;i++){
    w=parts[i];
    if(/^\d+(\.\d+)?$/.test(w)){current+=parseFloat(w);used=true;continue}
    if(w==='نیم'){current+=0.5;used=true;continue}
    if(NUM_MULT[w]){multi=true;current=(current||1)*NUM_MULT[w];total+=current;current=0;used=true;continue}
    if(NUM_WORDS[w]){current+=NUM_WORDS[w];used=true;continue}
    return {ok:false};
  }
  total+=current;
  return {ok:used&&total>0,value:total,used:used,multi:multi};
}
function parseImportance(input){
  var t=normFa(input);
  if(/خیلی مهم|بسیار مهم|خیلی زیاد|5|۵/.test(t))return 5;
  if(/بی.?اهمیت|هیچ|1|۱/.test(t))return 1;
  if(/کم|2|۲/.test(t))return 2;
  if(/متوسط|معمولی|3|۳/.test(t))return 3;
  if(/زیاد|مهم|4|۴/.test(t))return 4;
  var c=parseCountFA(t);return c.ok?Math.max(1,Math.min(5,c.value)):3;
}
function parseMoneyFA(input){
  var t=normFa(input);
  if(!t)return {ok:false,msg:'مبلغ را وارد کنید.'};
  var toman=/تومان|تومن/.test(t),hasRial=/ریال/.test(t);
  if(toman&&hasRial)return {ok:false,msg:'واحد را مشخص کنید: تومان یا ریال.'};
  var cleaned=t.replace(/تومان|تومن|ریال/g,' ').replace(/حدود|تقریبا|تقریباً|حداقل|حداکثر|مبلغ/g,' ').trim();
  if(/بین\s|\sتا\s|\sالی\s|[0-9]\s*[-–—]\s*[0-9]/.test(cleaned))return {ok:false,msg:'برای این فیلد یک مبلغ مشخص بدهید، نه بازه (مثلاً «۳ میلیارد»).'};
  var pr=parseNumberWords(cleaned);
  if(!pr.ok)return {ok:false,msg:'مبلغ را با عدد یا عبارتی مثل «۳ میلیارد» یا «۳ میلیون تومان» بنویسید.'};
  var value=pr.value*(toman?10:1);
  if(!isFinite(value)||value<=0)return {ok:false,msg:'مبلغ معتبر نیست؛ یک عدد مثبت وارد کنید.'};
  if(!toman&&!hasRial&&!pr.multi&&value<1000000){
    return {ok:false,msg:'مبلغ «'+t+'» مبهم است. اگر منظورتان ۳ میلیارد ریال است «۳ میلیارد» و اگر ۳ میلیون است «۳ میلیون» بنویسید.'};
  }
  var note=null;
  if(toman)note='✓ '+t+' = '+rial(Math.round(value))+' ثبت شد.';
  else if(pr.multi||/[آ-ی]/.test(cleaned))note='✓ مبلغ تفسیرشده: '+rial(Math.round(value));
  return {ok:true,value:Math.round(value),note:note,unit:toman?'toman':'rial'};
}
function parseCountFA(input){
  var t=normFa(input).replace(/تومان|تومن|ریال/g,' ');
  var cleaned=t.replace(/(^|\s)(خواب|خوابه|اتاق|متر|متری|متراژ|سال|ساله|طبقه|مسافر|نفر|شب|عدد|تا|الی|حدود|تقریبا|تقریباً)(?=\s|$)/g,' ');
  var pr=parseNumberWords(cleaned);
  if(!pr.ok)return {ok:false,msg:'یک عدد یا عبارت مثل «دو» یا «هفتاد» بنویسید.'};
  return {ok:true,value:Math.round(pr.value)};
}
function parseMoneyRangeFA(input){
  var t=normFa(input);
  var toman=/تومان|تومن/.test(t);
  var mult=0;
  if(/میلیارد/.test(t))mult=1e9;else if(/میلیون/.test(t))mult=1e6;else if(/هزار/.test(t))mult=1e3;
  var cleaned=t.replace(/تومان|تومن|ریال|میلیارد|میلیون|هزار|بین|از/g,' ');
  var parts=null;
  if(/\s+تا\s+|\s+الی\s+/.test(cleaned))parts=cleaned.split(/\s+(?:تا|الی)\s+/);
  else if(/[–|-]/.test(cleaned))parts=cleaned.split(/[–|-]/);
  else if(/\s+و\s+/.test(cleaned)&&/بین/.test(t))parts=cleaned.split(/\s+و\s+/);
  if(!parts||parts.length!==2)return {ok:false,msg:'بازه را با «تا» یا خط تیره بنویسید؛ مثلاً «۴۰۰ تا ۵۵۰ میلیون».'};
  var a=parseNumberWords(parts[0]),b=parseNumberWords(parts[1]);
  if(!a.ok||!b.ok)return {ok:false,msg:'دو عدد بازه را واضح بنویسید.'};
  var lo=a.value,hi=b.value;
  if(mult&&lo<1e6&&hi<1e6){lo*=mult;hi*=mult}
  if(toman&&lo<1e6&&hi<1e6){lo*=10;hi*=10}
  if(lo<=0||hi<=0)return {ok:false,msg:'بازهٔ معتبر وارد کنید.'};
  return {ok:true,value:Math.min(lo,hi)+'|'+Math.max(lo,hi),note:mult?'✓ بازه: '+rial(Math.min(lo,hi))+' تا '+rial(Math.max(lo,hi)):null};
}
function parseRangeFA(input){
  var t=normFa(input).replace(/بین/g,' ');
  var parts=null;
  if(/\s+تا\s+|\s+الی\s+/.test(t))parts=t.split(/\s+(?:تا|الی)\s+/);
  else if(/[–|-]/.test(t))parts=t.split(/[–|-]/);
  else if(/\s+و\s+/.test(t)&&/بین/.test(normFa(input)))parts=t.split(/\s+و\s+/);
  if(!parts||parts.length!==2)return {ok:false,msg:'بازه را با «تا» یا خط تیره بنویسید؛ مثلاً «۵۰ تا ۷۰».'};
  var a=parseNumberWords(parts[0]),b=parseNumberWords(parts[1]);
  if(!a.ok||!b.ok)return {ok:false,msg:'دو عدد بازه را واضح بنویسید.'};
  var lo=a.value,hi=b.value;
  return {ok:true,value:Math.min(lo,hi)+'|'+Math.max(lo,hi)};
}
function parsePercentListFA(input,count){
  var t=normFa(input).replace(/\s+و\s+/g,'-').replace(/[،,؛/]/g,'-').replace(/\s+/g,'-');
  var parts=t.split('-').filter(function(x){return x!==''});
  var out=[],i,pr;
  for(i=0;i<parts.length;i++){pr=parseNumberWords(parts[i]);if(!pr.ok)return {ok:false,msg:'درصدها را با عدد بنویسید؛ مثلاً 20-30-40-10.'};out.push(pr.value)}

}
function hoodFromText(input){
  var q=normFa(input).replace(/محله|منطقه|تهران|شمال|جنوب|شرق|غرب/g,' ').replace(/\s+/g,' ').trim();

  for(i=0;i<HOODS.length;i++){var n=normFa(HOODS[i].n).replace(/\s+/g,'');if(n===q.replace(/\s+/g,'')||n.indexOf(q.replace(/\s+/g,''))>=0||q.replace(/\s+/g,'').indexOf(n)>=0)return HOODS[i].id}

}
function stayFromText(input){
  var q=normFa(input).replace(/اقامتگاه|سوئیت|آپارتمان|ویلا|اجاره|در/g,' ').replace(/\s+/g,' ').trim();
  var hits=SLIST.filter(function(s){return normFa(s.t).indexOf(q)>=0||normFa(s.city).indexOf(q)>=0});

}
function projectIndexFromText(input){
  var q=normFa(input).replace(/پروژه|برج|مجتمع/g,' ').replace(/\s+/g,' ').trim();
  var i,hits=[];
  for(i=0;i<PRJ.length;i++){if(normFa(PRJ[i].t+' '+PRJ[i].loc).indexOf(q)>=0)hits.push(i)}

function supIndexFromText(input){
  var q=normFa(input),i;
  for(i=0;i<SUPS.length;i++){if(normFa(SUPS[i].t).indexOf(q)>=0||q.indexOf(normFa(SUPS[i].t.split('—')[0]))>=0)return i}

}
function matchChipText(input,chips){
  if(!chips||!chips.length)return null;
  var q=normFa(input).replace(/[^\w\u0600-\u06FF0-9. ]/g,' ').replace(/\s+/g,' ').trim();

    if(!partial&&q.length>=3&&(l.indexOf(q)>=0||q.indexOf(l)>=0))partial={value:String(c[1]),label:c[0],exact:false};

}

function a11yify(root){
  if(!root||!root.querySelectorAll){return}
  var sel='[data-act],[data-view],[data-cf],[data-cv],[data-cq],[data-cba],[data-w],[data-jump],[data-imp]';
  Array.prototype.forEach.call(root.querySelectorAll(sel),function(el){
    if(/^(BUTTON|A|INPUT|SELECT|TEXTAREA)$/.test(el.tagName)){return}
    if(!el.hasAttribute('role')){el.setAttribute('role','button')}
    if(!el.hasAttribute('tabindex')){el.setAttribute('tabindex','0')}
  });
  Array.prototype.forEach.call(root.querySelectorAll('.chip'),function(c){
    c.setAttribute('aria-pressed',c.classList.contains('on')?'true':'false');
  });
}

function spark(host,data,labels,fmt){
  if(!host){return}
  fmt=fmt||function(v){return fa(v,0)};
  var w=620,h=190,pL=70,pR=8,pT=16,pB=22,n=data.length,i,t,v,y;
  var lo=Math.min.apply(null,data)*0.96,hi=Math.max.apply(null,data)*1.05;
  function X(i){return pL+(w-pL-pR)*i/(n-1)}
  function Y(v){return pT+(h-pT-pB)*(1-(v-lo)/(hi-lo))}
  var g='',path='',pts='',area,step;
  for(t=0;t<=3;t++){v=lo+(hi-lo)*t/3;y=Y(v);g+='<line x1="'+pL+'" y1="'+y+'" x2="'+(w-pR)+'" y2="'+y+'" class="cg"/><text x="'+(w-pR)+'" y="'+(y-4)+'" class="cl" text-anchor="end">'+fmt(v)+'</text>'}
  step=Math.max(1,Math.floor(n/4));
  for(i=0;i<n;i+=step){g+='<text x="'+X(i)+'" y="'+(h-4)+'" class="xl" text-anchor="middle">'+(labels?labels[i]:'')+'</text>'}
  for(i=0;i<n;i++){path+=(i?'L':'M')+X(i).toFixed(1)+' '+Y(data[i]).toFixed(1)+' '}
  for(i=0;i<n;i++){pts+='<circle cx="'+X(i).toFixed(1)+'" cy="'+Y(data[i]).toFixed(1)+'" r="3.2" class="cp"/>'}
  area=path+'L'+X(n-1).toFixed(1)+' '+(h-pB)+' L'+X(0).toFixed(1)+' '+(h-pB)+' Z';
  host.innerHTML='<svg viewBox="0 0 '+w+' '+h+'" class="chart">'+g+'<path d="'+area+'" class="carea"/><path d="'+path+'" class="cline"/>'+pts+'</svg>';
}

function distKm(a,b){
  if(!a||!b)return null;

function svcCalc(it,qty){
  qty=+qty||it.min||1;
  if(it.unit==='fixed')qty=1;
  var labour=(it.unit==='m2'||it.unit==='hour')?(+it.rate||0)*qty:0;
  var subtotal=(+it.base||0)+labour;
  var fee=Math.round(subtotal*0.08);
  return {qty:qty,base:+it.base||0,labour:labour,subtotal:subtotal,fee:fee,total:subtotal+fee,providerShare:subtotal};
}
function svcOrderById(id){var i;for(i=0;i<S.svcOrders.length;i++){if(S.svcOrders[i].id===id)return S.svcOrders[i]}return null}

  if(s==='in_progress'||s==='accepted'||s==='scheduled')return 'در حال انجام';

function svcPost(url,body){
  var ctrl=window.AbortController?new AbortController():null;
  var timer=ctrl?setTimeout(function(){ctrl.abort()},15000):null;
  return fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body),signal:ctrl?ctrl.signal:undefined})
    .then(function(r){return r.json()})
    .then(function(j){if(timer)clearTimeout(timer);return j})

}
function svcQuote(ci,ii,qty,details){
  var it=svcItem(ci,ii),cfg=svcCfg();
  if(!it)return Promise.resolve(null);
  if(!cfg.quoteEndpoint)return Promise.resolve(svcCalc(it,qty));
  return svcPost(cfg.quoteEndpoint,{serviceId:ci+'-'+ii,quantity:+qty,details:details||{}})
    .then(function(j){
      if(!j||j.ok===false)throw new Error('quote');
      var base=+j.base||0,labour=+j.labour||0,fee=+j.fee||0,total=+j.total||(base+labour+fee);
      return {qty:+qty||1,base:base,labour:labour,subtotal:base+labour,fee:fee,total:total,providerShare:base+labour};
    });

function flowSummaryText(m){
  if(!m)return '';
  var bits=[];
  function add(k,v){if(v!==undefined&&v!==null&&v!=='')bits.push(k+': '+v)}
  if(m==='gate'){
    if(S.prof&&(S.prof.work||S.prof.workLL))add('محل کار','ثبت‌شده');
    if(S.prof&&(S.prof.school||S.prof.schoolLL))add('مدرسه','ثبت‌شده');
    return bits.join(' • ');
  }
  if(!S.flow||!S.flow[m])return '';
  var D=S.flow[m].data||{};
  if(m==='rent'){
    if(D.B&&D.B.depB)add('ودیعه',rial(D.B.depB));
    if(D.B&&D.B.rentB)add('اجاره',rial(D.B.rentB));
    if(D.hood)add('محله',findH(D.hood).n);
    if(D.listing)add('ملک',findL(D.listing).t);
    if(D.visitDay)add('بازدید',D.vday+' '+D.vtime);
    if(D.code&&D.signed)add('کد',D.code);
  }else if(m==='buy'){
    if(D.budg)add('بودجه',rial(D.budg));
    if(D.hood)add('محله',findH(D.hood).n);
    if(D.blist)add('ملک',findB(D.blist).t);
    if(D.legal)add('حقوقی','دریافت‌شده');
    if(D.escrow)add('امانی','تکمیل‌شده');
  }else if(m==='stay'){
    if(D.city)add('شهر',D.city);
    if(D.ppl)add('مسافر',fa(D.ppl,0));
    if(D.stay)add('اقامتگاه',findS(D.stay).t);
    if(D.nights)add('شب',fa(D.nights,0));
    if(D.code)add('کد',D.code);
  }else if(m==='mkt'){
    if(D.role)add('نقش',D.role==='con'?'پیمانکار':'کارفرما');
    if(D.bid)add('پیشنهاد',rial(D.bid.amt));
    if(D.confirmed)add('وضعیت','تأیید کارفرما');
  }else if(m==='build'){
    if(D.orders)add('سفارش',fa(D.orders.length,0));
    if(D.ph){var w=[12,34,22,18,14],tot=0,i;for(i=0;i<5;i++)tot+=w[i]*D.ph[i];add('پیشرفت',fa(tot/100,0)+'٪')}
  }else if(m==='invr'){
    if(D.cap)add('سرمایه',rial(D.cap));
    if(D.cnt)add('توکن',fa(D.cnt,0));
    if(D.fund)add('خرید','انجام‌شده');
  }
  return bits.slice(0,5).join(' • ');
}

function ceStep(){
  if(!CE.f){return}
  var sc=SCRIPTS[CE.f];
  if(CE.i>=sc.length){ceEnd();return}
  var st=sc[CE.i],D=wd(CE.f).data;
  if(st.pre&&st.pre(D)===false){cePush();CE.i++;ceStep();return}
  if(st.loop){botC(st.loop[CE.li].t,CHIP5());return}
  var q=st.q;
  if(typeof st.q==='function'){q=st.q(D)}
  if(st.cards){q+='<div class="chcards">'+st.cards(D)+'</div>'}
  botC(q,st.chips?st.chips(D):null);
}

  var f=CE.f;CE.f=null;

}

function ceVal(v){
  if(v==='!menu'){ceStart('gate');CE.i=3;ceStep();return}
  if(v==='!help'){
    botC('فرمان‌ها: «ادامه»، «محله‌ها»، «مقایسه»، «امضا»، «فسخ»، «چند توکن دارم»، «کیف پول»، «نقشه»، «منو».',[['منوی اصلی','!menu']]);
    return;
  }
  if(v.indexOf('F:')===0){
    var t=v.slice(2);
    if(t==='dashx'){go('dash')}
    else if(t==='sub'||t==='wallet'){S.ui.atab=(t==='sub'?'plan':'wallet');go('profile')}
    else if(t.indexOf('step:')===0){var sm=t.slice(5);if(MODBY[sm]){save();go(MODBY[sm].v)}else{ceStart(t)}}
    else{ceStart(t)}
    return;
  }
  if(v==='!wl'){ACT.wallet();return}
  if(v==='!svc'){go('svc');return}
  if(!CE.f){botC('از منوی اصلی شروع کنید:',[['منوی اصلی','!menu']]);return}
  var sc=SCRIPTS[CE.f],st=sc[CE.i],D=wd(CE.f).data;
  if(v.charAt(0)==='!'&&st.acts&&st.acts[v.slice(1)]){st.acts[v.slice(1)](D);return}
  if(st.loop){
    if(!D.P){D.P={}}
    D.P[st.loop[CE.li].k]=parseImportance(v);
    CE.li++;
    if(CE.li<st.loop.length){botC(st.loop[CE.li].t,CHIP5())}
    else{CE.i++;CE.li=0;save();renderCurrent();ceStep()}
    return;
  }
  var v0=String(v),note=null;
  if(st.money||st.count||st.range||st.moneyRange){
    D._inputs=D._inputs||{};D._inputs[st.id||('step'+CE.i)]=v0;
  }
  if(st.money){
    var pm=parseMoneyFA(v0);
    if(!pm.ok){botC(pm.msg);return}
    v=String(pm.value);note=pm.note;
  }else if(st.count){
    var pc=parseCountFA(v0);
    if(!pc.ok){botC(pc.msg);return}
    v=String(pc.value);
  }else if(st.range){
    var prg=parseRangeFA(v0);
    if(!prg.ok){botC(prg.msg);return}
    v=prg.value;
  }else if(st.moneyRange){
    var pmr=parseMoneyRangeFA(v0);
    if(!pmr.ok){botC(pmr.msg);return}
    v=pmr.value;note=pmr.note;
  }
  var done=null;
  if(st.set){done=st.set(D,v)}
  else if(st.key){D[st.key]=v}
  if(done==='ERR'){botC(st.err||('این مقدار در بازهٔ مجاز نیست. '+(st.hint||'یک مقدار معتبر وارد کنید.')));return}
  if(note){botC(note)}
  if(st.until){
    if(done==='DONE'){cePush();CE.i++;save();renderCurrent();ceStep()}
    else{save();botC('✓ اضافه شد. مورد دیگر؟ (یا «تمام»)',[['تمام','تمام']])}
    return;
  }
  cePush();CE.i++;CE.li=0;save();renderCurrent();ceStep();
}
function ceSend(t){
  if(t==null)return;
  if(String(t)==='!back'){ceBack();return}
  t=(t||'').replace(/^\s+|\s+$/g,'');
  if(!t){return}
  var q=t.replace(/[يى]/g,'ی');
  if(/^(درخواست|نقشه|کیف پول|داشبورد|راهنما|کمک|منو)/.test(q)){
    usrC(t);
    if(/^درخواست/.test(q)){DASHT='req';DASHF='open';go('dash');return}
    if(/^نقشه/.test(q)){go('map');return}
    if(/^کیف پول/.test(q)){ACT.wallet();return}
    if(/^داشبورد/.test(q)){go('dash');return}
    if(/^(راهنما|کمک)/.test(q)){ceVal('!help');return}
    if(/^منو/.test(q)){ceVal('!menu');return}
  }
  if(CE.f){
    var stc=SCRIPTS[CE.f][CE.i];
    if(stc&&stc.chips){
      var mc=matchChipText(t,stc.chips(wd(CE.f).data));
      var numericStep=!!(stc.money||stc.count||stc.range||stc.moneyRange||stc.kind==='num');
      if(mc&&(mc.exact||(!numericStep&&stc.kind!=='text'))){usrC(t);ceVal(mc.value);return}
    }
  }
  var st=CE.f?SCRIPTS[CE.f][CE.i]:null;
  if(st&&(st.kind==='text'||st.kind==='num'||st.set||st.loop||st.until)){usrC(t);ceVal(t,t);return}
  usrC(t);
  var n=pd(t).replace(/[يى]/g,'ی');
  var nn=t.replace(/[يى]/g,'ی');
  if(/توکن/.test(nn)){CBT.tok();return}
  if(/کیف پول/.test(nn)){ACT.wallet();return}
  if(/فسخ/.test(nn)&&CE.f==='rent'&&wd('rent').data.signed){ceJump('termq');return}
  if(/امضا/.test(nn)&&CE.f==='rent'){ceJump('ctr0');return}
  if((n.indexOf('محله')===0)&&((CE.f==='rent')||(CE.f==='buy'))){ceJump('hoods');return}
  if(/مقایسه/.test(nn)&&((CE.f==='rent')||(CE.f==='buy'))){ceJump('hoods');return}
  if(/نقشه/.test(nn)){go('map');return}
  if(/درخواست/.test(nn)){DASHT='req';DASHF='open';go('dash');return}
  if(/راهنما|کمک/.test(nn)){ceVal('!help');return}
  if(/منو/.test(nn)){ceVal('!menu');return}
  if(/داشبورد/.test(nn)){go('dash');return}
  if(ceSmart(t)){return}
  botC('متوجه نشدم  — «راهنما» را بزنید یا از دکمه‌ها استفاده کنید.',[['راهنما','!help'],['منوی اصلی','!menu']]);
}

function conInit(D,kind){
  kind=kind||'rent';
  if(!D.ctr){
    D.ctr={kind:kind,step:1,draftCode:'MH-'+String(Date.now()).slice(-6),parties:{},prop:{},terms:{},verify:{me:'none',owner:'none'},appr:{me:false,owner:false,meName:'',ownerName:''},finalized:false};

  c.parties=c.parties||{};c.prop=c.prop||{};c.terms=c.terms||{};c.verify=c.verify||{me:'none',owner:'none'};c.appr=c.appr||{me:false,owner:false,meName:'',ownerName:''};
  c.parties.lessee=c.parties.lessee||{name:S.auth?S.auth.name:'',id:'',mobile:S.auth?S.auth.phone:''};
  c.parties.lessor=c.parties.lessor||{name:'',id:'',mobile:''};
  if(!c.parties.witnesses)c.parties.witnesses=[{name:'',mobile:''},{name:'',mobile:''}];
  if(kind==='buy'){
    if(D.blist&&!c.prop.title){var b=findB(D.blist);c.prop.title=b.t;c.prop.area=b.m2;c.prop.hood=findH(b.hood).n}
    if(c.terms.price===undefined)c.terms.price=D.price||D.budg||0;
    if(!c.terms.payment)c.terms.payment=(D.pay&&D.pay.staged)?'مرحله‌ای':'یکجا';
    if(!c.terms.delivery)c.terms.delivery='';
  }else{
    if(D.listing&&!c.prop.title){var x=findL(D.listing);c.prop.title=x.t;c.prop.area=x.m2;c.prop.hood=findH(x.hood).n}
    if(c.terms.deposit===undefined)c.terms.deposit=D.B?D.B.depB:0;
    if(c.terms.rent===undefined)c.terms.rent=D.B?rentCalc(D).rent:0;
    if(!c.terms.duration)c.terms.duration=D.dur||'یک‌ساله';
    if(!c.terms.paymentDay)c.terms.paymentDay='پنجم هر ماه';
    if(!c.terms.start)c.terms.start='';
  }
  return c;
}
function conStatus(D,kind){
  var c=conInit(D,kind||'rent');

  if(!c.parties.lessee.id||c.verify.me==='none'||!c.parties.lessor.name)return c.parties.lessee.id?'identity':'draft';
  if(!c.prop.postal||!c.prop.addr||((c.kind==='rent')?(!c.terms.rent||!c.terms.deposit):(!c.terms.price)))return 'info';
  if(!(c.appr.me&&c.appr.owner))return 'approval';

}

function lookupStatus(id,cls,txt){
