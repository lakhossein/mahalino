name: Mahalino V0.33 required quality gate

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main, 'feature/**', 'fix/**', 'release/**']
    paths:
      - 'V0.33/**'
      - '.github/workflows/mahalino-v033-quality-gate.yml'
      - '.github/workflows/pages.yml'
  pull_request:
    branches: [main]
    paths:
      - 'V0.33/**'
      - '.github/workflows/mahalino-v033-quality-gate.yml'
      - '.github/workflows/pages.yml'

permissions:
  contents: read

# New feature revisions supersede earlier checkpoints, without cancelling main/Pages runs.
concurrency:
  group: mahalino-v033-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/heads/feature/') }}

jobs:
  chromium-acceptance:
    name: Browser acceptance and reproducible build
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: V0.33/qa/package-lock.json
      - name: Install pinned test dependencies
        run: npm ci --prefix V0.33/qa
      - name: Install Chromium
        run: V0.33/qa/node_modules/.bin/playwright install --with-deps chromium
      - name: Run every V0.33 quality gate
        run: bash V0.33/qa/run-quality-gate.sh
      - name: Preserve logs, screen captures and JSON results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mahalino-v033-release-gate-results
          path: V0.33/qa/results/
          retention-days: 45
          if-no-files-found: warn
